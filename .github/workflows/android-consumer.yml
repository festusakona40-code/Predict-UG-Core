name: Public Consumer Android CI

on:
  pull_request:
    paths:
      - "android/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/prepare-consumer-assets.mjs"
      - ".github/workflows/android-consumer.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/prepare-consumer-assets.mjs"
      - ".github/workflows/android-consumer.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-consumer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned browser dependency
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prepare bundled browser dependency
        run: node scripts/prepare-consumer-assets.mjs

      - name: Verify release/update contract
        run: node scripts/verify-android-release-contract.mjs

      - name: Enforce sanitized mirror boundary and provenance
        run: node scripts/verify-public-mirror-boundary.mjs

      - name: Verify exact private-source export parity
        run: node scripts/verify-public-export.mjs

      - name: Verify origin-bound native bridge
        shell: bash
        run: |
          set -euo pipefail
          MAIN="android/app/src/main/java/com/predictug/app/MainActivity.java"
          BRIDGE="android/app/src/main/java/com/predictug/app/PlayIntegrityBridge.java"
          ! grep -R -n 'addJavascriptInterface' android/app/src/main/java
          ! grep -R -n '@JavascriptInterface' android/app/src/main/java
          grep -q 'WebViewFeature.WEB_MESSAGE_LISTENER' "$MAIN"
          grep -q 'WebViewCompat.addWebMessageListener' "$MAIN"
          grep -q 'Collections.singleton(APP_ORIGIN)' "$MAIN"
          grep -q 'message.getType() != WebMessageCompat.TYPE_STRING' "$MAIN"
          grep -q 'handleMessage(message.getData(), replyProxy)' "$MAIN"
          grep -q 'JavaScriptReplyProxy' "$BRIDGE"

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore stable public beta debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: predict-ug-public-beta-debug-keystore-v1

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          gradle-version: "9.6.0"

      - name: Test and build consumer app
        working-directory: android
        run: gradle --no-daemon :app:testConsumerDebugUnitTest :app:assembleConsumerDebug :app:bundleConsumerRelease

      - name: Verify consumer permission boundary
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/consumer/debug/app-consumer-debug.apk"
          AAB="android/app/build/outputs/bundle/consumerRelease/app-consumer-release.aab"
          test -s "$APK"
          test -s "$AAB"

          ANALYZER="$(command -v apkanalyzer || true)"
          if [ -z "$ANALYZER" ]; then
            ANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          fi

          permissions="$("$ANALYZER" manifest permissions "$APK")"
          if printf '%s' "$permissions" | grep -q 'android.permission.RECEIVE_SMS\|android.permission.READ_SMS'; then
            echo "::error::Public consumer APK must never request SMS permissions"
            exit 1
          fi

          unzip -l "$APK" | grep -q 'assets/index.html'
          unzip -l "$APK" | grep -q 'assets/supabase.js'

          sha256sum "$APK" "$AAB" > android/SHA256SUMS.txt
          APKSIGNER="$(command -v apksigner || true)"
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          fi
          "$APKSIGNER" verify --print-certs "$APK" > android/SIGNING_CERT.txt
          cat android/SHA256SUMS.txt
          cat android/SIGNING_CERT.txt

      - name: Upload unsigned public build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: predict-ug-public-consumer
          path: |
            android/app/build/outputs/apk/consumer/debug/app-consumer-debug.apk
            android/app/build/outputs/bundle/consumerRelease/app-consumer-release.aab
            android/SHA256SUMS.txt
            android/SIGNING_CERT.txt
          retention-days: 14

      - name: Publish verified beta APK branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/consumer/debug/app-consumer-debug.apk"
          AAB="android/app/build/outputs/bundle/consumerRelease/app-consumer-release.aab"
          VERSION="$(grep -E "versionName '[^']+'" android/app/build.gradle | sed -E "s/.*versionName '([^']+)'.*/\1/")"
          VERSION_CODE="$(grep -E 'versionCode [0-9]+' android/app/build.gradle | sed -E 's/.*versionCode ([0-9]+).*/\1/')"
          APK_SHA="$(sha256sum "$APK" | awk '{print $1}')"
          AAB_SHA="$(sha256sum "$AAB" | awk '{print $1}')"
          APK_SIZE="$(stat -c '%s' "$APK")"
          CERT_SHA="$(grep 'certificate SHA-256 digest:' android/SIGNING_CERT.txt | head -1 | awk '{print $NF}')"
          export VERSION VERSION_CODE APK_SHA AAB_SHA APK_SIZE CERT_SHA

          rm -rf /tmp/predict-ug-beta-release
          mkdir -p /tmp/predict-ug-beta-release
          cp "$APK" /tmp/predict-ug-beta-release/predict-ug.apk
          cp "$AAB" /tmp/predict-ug-beta-release/predict-ug.aab
          cp android/SHA256SUMS.txt /tmp/predict-ug-beta-release/SHA256SUMS.txt
          cp android/SIGNING_CERT.txt /tmp/predict-ug-beta-release/SIGNING_CERT.txt

          node -e '
            const fs=require("fs");
            const meta={
              channel:"public-beta",
              version:process.env.VERSION,
              versionCode:Number(process.env.VERSION_CODE),
              apkSha256:process.env.APK_SHA,
              aabSha256:process.env.AAB_SHA,
              apkSizeBytes:Number(process.env.APK_SIZE),
              signingCertificateSha256:process.env.CERT_SHA,
              signingIdentity:"Android Debug",
              betaSigning:true,
              sourceCommit:process.env.GITHUB_SHA,
              sourceRunId:Number(process.env.GITHUB_RUN_ID),
              productionMoneyEnabled:false
            };
            fs.writeFileSync("/tmp/predict-ug-beta-release/latest.json",JSON.stringify(meta,null,2)+"\n");
          '
      - name: Commit verified beta APK branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "predict-ug-ci"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan public-beta-artifacts-work
          git rm -rf . || true
          git clean -fdx
          cp /tmp/predict-ug-beta-release/* .
          git add predict-ug.apk predict-ug.aab SHA256SUMS.txt SIGNING_CERT.txt latest.json
          git commit -m "release: publish verified Predict UG beta from $GITHUB_SHA"
          git push --force origin HEAD:public-beta-artifacts
