name: Public Consumer Android CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-consumer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned browser dependency
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prepare bundled browser dependency
        run: node scripts/prepare-consumer-assets.mjs

      - name: Guard public source boundary
        shell: bash
        run: |
          set -euo pipefail
          test ! -d supabase/migrations
          test ! -d android/app/src/merchant
          if grep -R -n -E 'RECEIVE_SMS|READ_SMS|MerchantSmsReceiver|MerchantSecureStore|SUPABASE_SERVICE_ROLE_KEY|sb_secret_|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' .             --exclude-dir=.git --exclude-dir=.github --exclude-dir=node_modules --exclude=package-lock.json; then
            echo "::error::Private or sensitive source leaked into the public consumer build"
            exit 1
          fi
          test -s android/app/src/main/assets/supabase.js

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          gradle-version: "9.6.0"

      - name: Test and build consumer app
        working-directory: android
        run: gradle --no-daemon :app:testConsumerDebugUnitTest :app:assembleConsumerDebug :app:bundleConsumerRelease

      - name: Verify consumer permission boundary
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/consumer/debug/app-consumer-debug.apk"
          AAB="android/app/build/outputs/bundle/consumerRelease/app-consumer-release.aab"
          test -s "$APK"
          test -s "$AAB"

          ANALYZER="$(command -v apkanalyzer || true)"
          if [ -z "$ANALYZER" ]; then
            ANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          fi

          permissions="$("$ANALYZER" manifest permissions "$APK")"
          if printf '%s' "$permissions" | grep -q 'android.permission.RECEIVE_SMS\|android.permission.READ_SMS'; then
            echo "::error::Public consumer APK must never request SMS permissions"
            exit 1
          fi

          unzip -l "$APK" | grep -q 'assets/index.html'
          unzip -l "$APK" | grep -q 'assets/supabase.js'
          sha256sum "$APK" "$AAB"

      - name: Upload unsigned public build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: predict-ug-public-consumer
          path: |
            android/app/build/outputs/apk/consumer/debug/app-consumer-debug.apk
            android/app/build/outputs/bundle/consumerRelease/app-consumer-release.aab
          retention-days: 14
