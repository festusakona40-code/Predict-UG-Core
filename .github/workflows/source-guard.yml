name: Public Source Guard

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-source-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Reject private source classes and secret material
        shell: bash
        run: |
          set -euo pipefail
          test ! -d supabase/migrations
          test ! -d android/app/src/merchant

          if find . -type f \( -name '*.jks' -o -name '*.keystore' -o -name '*.pem' -o -name '*.p12' -o -name '*.pfx' \) -print -quit | grep -q .; then
            echo "::error::Signing or key material is forbidden in the public mirror"
            exit 1
          fi

          if grep -R -n -E 'SUPABASE_SERVICE_ROLE_KEY|sb_secret_|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|RECEIVE_SMS|READ_SMS|MerchantSmsReceiver|MerchantSecureStore' .             --exclude-dir=.git --exclude-dir=.github --exclude=package-lock.json; then
            echo "::error::Private or sensitive source leaked into the public mirror"
            exit 1
          fi
