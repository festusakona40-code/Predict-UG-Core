plugins {
    id 'com.android.application'
}

def playCloudProjectNumber = (System.getenv("PREDICT_UG_PLAY_CLOUD_PROJECT_NUMBER") ?: "0").replaceAll("[^0-9]", "")
if (!playCloudProjectNumber) playCloudProjectNumber = "0"

android {
    namespace 'com.predictug.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.predictug.app'
        minSdk 23
        targetSdk 36
        versionCode 55
        versionName '0.7.49'
        buildConfigField "long", "PLAY_CLOUD_PROJECT_NUMBER", playCloudProjectNumber + "L"
    }

    flavorDimensions += "mode"
    productFlavors {
        consumer { dimension "mode" }
    }

    buildFeatures { buildConfig true }

    buildTypes {
        release { minifyEnabled false }
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.12.4'
    testImplementation 'junit:junit:4.13.2'
    implementation 'androidx.webkit:webkit:1.15.0'
    implementation 'com.google.android.play:integrity:1.6.0'
}
