window.__predictUgShowStartupFailure=function(message){
  if(window.__predictUgBootReady)return;

  if(!view)return;
  const box=document.createElement('div');
  box.className='empty';
  const title=document.createElement('h2');title.textContent='Predict UG startup problem';
  const msg=document.createElement('p');msg.textContent=String(message||'Startup timed out.').slice(0,280);
  const retry=document.createElement('button');retry.className='btn primary';retry.textContent='Retry';retry.onclick=function(){location.reload()};
  const reset=document.createElement('button');reset.className='btn ghost';reset.style.marginLeft='8px';reset.textContent='Reset saved session';
  reset.onclick=function(){
    try{
      for(let i=localStorage.length-1;i>=0;i--){
        const k=localStorage.key(i)||'';
        if(k.startsWith('sb-')&&k.includes('auth-token'))localStorage.removeItem(k);
      }

};
window.addEventListener('error',function(e){

});
window.addEventListener('unhandledrejection',function(e){

});
window.__predictUgBootTimer=setTimeout(function(){
  window.__predictUgShowStartupFailure('Startup took too long. Retry, or reset the saved session if this started after an update.');
},12000);

function starterMarketCandidate(){
  const rows=Array.isArray(state.markets)?state.markets:[];
  const eligible=rows.filter(m=>m?.market_id&&!m?.external_benchmark&&!isPoliticalCategory(m?.category||m?.category_key));
  const score=m=>{
    const cat=String(m?.category||m?.category_key||'').toLowerCase();
    const title=String(m?.title||'').toLowerCase();
    const verified=String(m?.data_status||'')==='verified';
    const closeMs=Date.parse(m?.close_time||'');
    const days=Number.isFinite(closeMs)?Math.max(0,(closeMs-Date.now())/86400000):999;
    if(/sport|football|soccer/.test(cat+' '+title))return 0;
    if(cat==='weather'&&verified&&days<=7)return 1;
    if(cat==='entertainment'&&days<=14)return 2;
    if(verified&&days<=14)return 3;
    if(cat==='entertainment')return 4;
    if(verified)return 5;
    return 6;
  };
  return eligible.slice().sort((a,b)=>{
    const rank=score(a)-score(b);
    if(rank)return rank;
    const ac=Date.parse(a?.close_time||'')||Number.MAX_SAFE_INTEGER;
    const bc=Date.parse(b?.close_time||'')||Number.MAX_SAFE_INTEGER;
    return ac-bc;
  })[0]
    ||rows.find(m=>m?.market_id&&!isPoliticalCategory(m?.category||m?.category_key))
    ||null;
}

function rpcNeedsNetworkMutationGuard(name){
  const n=String(name||'');
  return /^(place_|cancel_|cash_out_|request_|set_|settle_|void_|create_|accept_|delete_|update_|save_|challenge_)/.test(n) ||
    /^(admin_.*(?:create|set|add|publish|propose|review|clear|update|pair|revoke)|mark_)/.test(n);
}
function rpcTimeoutSignal(ms){
  if(typeof AbortSignal!=='undefined'&&typeof AbortSignal.timeout==='function'){
    return AbortSignal.timeout(ms);
  }
  const controller=new AbortController();
  setTimeout(()=>controller.abort(),ms);
  return controller.signal;
}
function rpcReadRetryable(error){
  const code=String(error?.code||'').toUpperCase();
  const msg=String(error?.message||error||'').toLowerCase();
  if(code==='42501'||code.startsWith('23')||code.startsWith('PGRST1')||code.startsWith('PGRST2'))return false;
  return code.startsWith('08')
    ||code.startsWith('53')
    ||['PGRST000','PGRST001','PGRST002','PGRST003'].includes(code)
    ||/timeout|timed out|network|failed to fetch|fetch failed|aborted|connection/.test(msg);
}
async function rpc(name,args={}){
  const mutating=rpcNeedsNetworkMutationGuard(name);
  if(!state.online&&mutating){
    throw new Error('Offline: reconnect before changing markets, orders, account data or money.');
  }
  const maxAttempts=mutating?1:3;
  let lastError=null;
  for(let attempt=0;attempt<maxAttempts;attempt++){
    const timeoutMs=mutating?15000:8000;
    try{
      const rpcClient=(!mutating&&!state.user)?publicSupabase:supabase;
      const query=rpcClient.rpc(name,args).abortSignal(rpcTimeoutSignal(timeoutMs));
      const {data,error}=await query;
      if(!error)return data;
      lastError=error;
    }catch(error){
      lastError=error;
    }
    if(mutating||!state.online||!rpcReadRetryable(lastError)||attempt===maxAttempts-1)break;
    await new Promise(resolve=>setTimeout(resolve,attempt===0?300:850));
  }
  throw lastError||new Error('Predict UG request failed');
}

      state.status=next;

function ugandaDateKey(value){
  const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Africa/Kampala',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(value));
  const get=type=>parts.find(x=>x.type===type)?.value;
  return get('year')+'-'+get('month')+'-'+get('day');
}
function selectMarketFeedRows(rows,sort,now=Date.now()){
  if(sort==='pending')return rows.filter(m=>m.status==='closed').sort((a,b)=>Date.parse(b.close_time)-Date.parse(a.close_time));
  let result=rows.filter(m=>String(m.status||'open').toLowerCase()==='open'&&Number.isFinite(Date.parse(m.close_time))&&Date.parse(m.close_time)>now);
  if(sort==='today')result=result.filter(m=>ugandaDateKey(m.close_time)===ugandaDateKey(now));
  if(sort==='closing')result=result.filter(m=>Date.parse(m.close_time)-now<=72*3600000);
  if(['live','today','closing'].includes(sort))result.sort((a,b)=>Date.parse(a.close_time)-Date.parse(b.close_time));
  if(sort==='active')result.sort((a,b)=>Number(b.total_pool_ugx||0)-Number(a.total_pool_ugx||0));
  return result;
}

async function openMarket(id,{updateUrl=true,preselectLabel=null,openSource='feed'}={}){
  const key='market:'+id;
  let page=null;
  try{
    page=await rpc('market_page',{p_market_id:id});
    page.__offline_cache=false;
    if(state.user&&state.online){
      try{
        const {data:user}=await supabase.auth.getUser();
        const uid=user.user?.id;
        const {data:ex}=await supabase.from('watchlist').select('id').eq('user_id',uid).eq('market_id',id).maybeSingle();
        page.__watched=!!ex;
      }catch{page.__watched=false}
    }else page.__watched=false;
    cacheWrite(key,page);
  }catch(e){
    const cached=cacheRead(key);
    if(!cached){toast(e.message||'Could not open market',true);return}
    page={...(cached.value||{}),__offline_cache:true,__offline_saved_at:cached.saved_at};
    toast('Offline: showing last synced market ('+cachedAgeLabel(cached)+')');
  }
  if(preselectLabel)page.__preselect_label=String(preselectLabel).toUpperCase();
  state.market=page;
  trackBehavior('market_view',{category:page?.market?.category||page?.market?.category_key,marketId:id,metadata:{open_source:openSource,preselected_side:preselectLabel?String(preselectLabel).toUpperCase():null}});
  if(updateUrl&&linkedMarketId()!==id)setMarketUrl(id);
  drawMarket();
  if(state.online&&!isClosed(page.market))startMarketRealtime(id);else stopMarketRealtime();
}
function historySvg(d){
  const outs=d?.outcomes||[];const yes=outs.find(o=>String(o.label).toUpperCase()==='YES');if(!yes)return '<div class="empty">No chart data.</div>';
  const pts=(d.history||[]).filter(x=>x.outcome_id===yes.id).map(x=>Number(x.display_probability));
  if(pts.length<2)return '<div class="empty">Probability history will appear as trades arrive.</div>';
  const w=600,h=135,p=8;const min=0,max=100;
  const xy=pts.map((v,i)=>[(i/(pts.length-1))*(w-p*2)+p,h-p-((v-min)/(max-min))*(h-p*2)]);
  const path=xy.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><path d="'+path+'" fill="none" stroke="var(--k-green)" stroke-width="3" vector-effect="non-scaling-stroke"/><line x1="0" y1="'+h/2+'" x2="'+w+'" y2="'+h/2+'" stroke="var(--k-line)" stroke-dasharray="5 5"/></svg>';
}

async function showAdvancedBuy(m,outcome){
  if(!state.online){toast('Offline: reconnect before placing an order.',true);return}
  if(!state.user){showAuth();return}
  if(!outcome?.id){toast('Outcome unavailable',true);return}
  try{
    const book=await rpc('secondary_orderbook',{p_market_id:m.id,p_outcome_id:outcome.id});
    const bestBid=book?.bids?.[0];
    const bestAsk=book?.asks?.[0];
    const box=$('#advancedBook');
    if(box){
      box.innerHTML=
        '<div class="quote-row"><span>Selected</span><b>'+esc(outcome.label)+'</b></div>'+
        '<div class="quote-row"><span>Best buyer</span><b>'+(bestBid?ugx(bestBid.price_per_1000_ugx)+' / 1,000':'None yet')+'</b></div>'+
        '<div class="quote-row"><span>Best seller</span><b>'+(bestAsk?ugx(bestAsk.price_per_1000_ugx)+' / 1,000':'None yet')+'</b></div>'+
        '<div class="quote-row"><span>Recent trades</span><b>'+Number(book?.recent_fills?.length||0)+'</b></div>';
    }

    if(!confirm('Advanced '+outcome.label+' trading\n\nThe order book is shown below. Place a limit BUY order?'))return;

    const qty=Number(prompt('How much '+outcome.label+' position do you want? Use 1,000 steps.','5000')||0);
    if(qty<1000||qty%1000!==0){
      toast('Use 1,000-unit steps',true);
      return;
    }

    const suggested=bestAsk?.price_per_1000_ugx||bestBid?.price_per_1000_ugx||'';
    const price=Number(prompt(
      'Maximum price for each 1,000 of position.'+
      (bestAsk?' Best seller asks '+ugx(bestAsk.price_per_1000_ugx)+'.':''),
      String(suggested)
    )||0);
    if(price<=0)return;

    const reserve=Math.ceil(qty*price/1000);
    if(!confirm('Reserve up to '+ugx(reserve)+' for this advanced order?'))return;

    const result=await rpc('place_secondary_order',{
      p_market_id:m.id,
      p_outcome_id:outcome.id,
      p_side:'buy',
      p_quantity_stake_ugx:qty,
      p_price_per_1000_ugx:price,
      p_idempotency_key:'web-limit-buy-'+crypto.randomUUID(),
      p_source_position_id:null
    });

    const order=result?.result?.order||{};
    toast(order.status==='filled'?'Advanced order filled':'Advanced order placed');
    if(box){
      const fresh=await rpc('secondary_orderbook',{p_market_id:m.id,p_outcome_id:outcome.id});
      const bid=fresh?.bids?.[0],ask=fresh?.asks?.[0];
      box.innerHTML=
        '<div class="quote-row"><span>Best buyer</span><b>'+(bid?ugx(bid.price_per_1000_ugx)+' / 1,000':'None')+'</b></div>'+
        '<div class="quote-row"><span>Best seller</span><b>'+(ask?ugx(ask.price_per_1000_ugx)+' / 1,000':'None')+'</b></div>'+
        '<div class="quote-row"><span>Your order</span><b>'+esc(order.status||'placed')+'</b></div>';
    }
  }catch(e){
    toast(e.message||'Advanced order failed',true);
  }
}

function lifecycleStripHtml(m,d){
  const status=String(m?.status||'open').toLowerCase();
  const proposal=d?.resolution?.latest_proposal||{};
  const settled=['resolved','void'].includes(status);
  const closed=settled||status==='closed'||status==='suspended'||new Date(m?.close_time)<new Date();
  const reviewing=!settled&&(proposal?.id||closed);
  const step=(label,mode)=>'<div class="lifecycle-step '+mode+'">'+label+'</div>';
  return '<div class="lifecycle-strip">'+
    step('1 · Trading',status==='open'?'active':'done')+
    step('2 · Closed',closed?(reviewing?'done':'active'):'')+
    step('3 · Determination',settled?'done':reviewing?'active':'')+
    step('4 · Settled',settled?'active':'')+
  '</div>';
}

function claimAuthorityName(id){
  const key=String(id||'');
  const names={
    'ubos-official':'Uganda Bureau of Statistics (UBOS)',
    'bank-of-uganda':'Bank of Uganda',
    'pau-official':'Petroleum Authority of Uganda',
    'memd-official':'Ministry of Energy and Mineral Development (MEMD)',
    'maaif-official':'Ministry of Agriculture, Animal Industry and Fisheries (MAAIF)',
    'unma-official':'Uganda National Meteorological Authority (UNMA)',
    'parliament-uganda':'Parliament of Uganda',
    'electoral-commission-ug':'Electoral Commission of Uganda',
    'uganda-police-official':'Uganda Police Force',
    'ura-official':'Uganda Revenue Authority',
    'statehouse-uganda':'State House Uganda',
    'ucc-official':'Uganda Communications Commission',
    'uneb-official':'Uganda National Examinations Board',
    'nche-uganda-universities':'National Council for Higher Education'
  };
  return names[key]||key.replaceAll('-',' ');
}
function claimVerificationLabel(x){
  const s=String(x?.verification_status||'unverified');
  const labels={
    verified:'Verified by official source',
    contradicted:'Contradicted by official source',
    official_source_available:'Official source mapped',
    needs_value_verification:'Checking official value',
    needs_authoritative_fuel_source:'Needs fuel type + location',
    unsupported:'No official verifier yet',
    not_verifiable:'Not verifiable as a factual claim',
    opinion_or_causal_claim:'Opinion / causal claim'
  };
  if(labels[s])return labels[s];
  const source=x?.verification_source_id||x?.authoritative_source_id;
  if(source)return 'Check with '+claimAuthorityName(source);
  return s.replaceAll('_',' ');
}
function claimMarketLabel(x){
  const raw=String(x?.marketability_status||x?.market_eligibility||'context_only');
  const labels={
    context_only:'Context only · not a market',
    future_claim_candidate:'Possible future market · needs official rule',
    needs_future_rule:'Needs a future deadline / rule',
    needs_verifier_and_location:'Needs verifier + location',
    needs_location_and_threshold:'Needs location + measurable threshold',
    needs_quantitative_rule:'Needs a measurable rule',
    blocked_unverifiable:'Blocked · no reliable verifier',
    not_market_ready:'Not market-ready',
    eligible:'Potential market · still needs full contract checks'
  };
  return labels[raw]||raw.replaceAll('_',' ');
}

async function loadBetaMission(){

  const current=()=>state.user?.id===userId&&state.betaMissionRequest===request;
  try{
    const data=await rpc('my_positions');
    if(!current())return;
    const positions=Array.isArray(data?.positions)?data.positions:[];
    const trades=positions.reduce((sum,p)=>sum+Math.max(0,Number(p?.trade_count||0)),0);
    const goal=3;
    state.betaMission={trades,goal,complete:trades>=goal,remaining:Math.max(0,goal-trades)};
  }catch(e){
    if(!current())return;
    state.betaMission=null;
    reportClientError(e.message||'Could not load beta mission',e.stack||'',{kind:'beta_mission_load'});
  }
}

async function cashOutSimple(pos){
  if(!state.online){toast('Offline: reconnect before exiting a position.',true);return}
  try{
    const max=Number(pos.sellable_stake_ugx||0);
    if(max<1000){toast('Nothing is available to exit',true);return}
    const q=await rpc('secondary_cashout_quote',{
      p_source_position_id:pos.position_id,
      p_quantity_stake_ugx:max
    });
    const fill=Number(q.fillable_stake_ugx||0);
    const proceeds=Number(q.estimated_cashout_ugx||0);

    if(fill<1000){
      toast('No buyer is ready right now. Use Advanced offer if you want to set your own price.',true);
      return;
    }

    const action=q.mode==='cash'?'Cash Out':'Exit Prediction';
    const partial=fill<max
      ?'A buyer can take '+ugx(fill)+' of your '+ugx(max)+' position right now.'
      :'Your full available position can be taken right now.';
    const receive=q.mode==='cash'
      ?'You receive about '+ugx(proceeds)+'.'
      :'You receive about '+ugx(proceeds)+' prediction credits.';

    if(!confirm(action+'\n\n'+partial+'\n'+receive+'\n\nContinue?'))return;

    const result=await rpc('cash_out_position_now',{
      p_source_position_id:pos.position_id,
      p_quantity_stake_ugx:fill,
      p_idempotency_key:'web-cashout-'+crypto.randomUUID()
    });

    toast((q.mode==='cash'?'Cash out':'Exit')+' completed: '+ugx(result.proceeds_ugx||0));
    await loadPortfolio();
    render();
  }catch(e){
    toast(e.message||'Could not exit prediction',true);
  }
}

  try{

    const bestBid=book?.bids?.[0];

  }catch(e){

function integrityCanonical(value){
  if(value===null||typeof value!=='object')return JSON.stringify(value);
  if(Array.isArray(value))return '['+value.map(integrityCanonical).join(',')+']';
  return '{'+Object.keys(value).sort().map(k=>JSON.stringify(k)+':'+integrityCanonical(value[k])).join(',')+'}';
}
function integrityBase64Url(bytes){
  let binary='';for(const b of bytes)binary+=String.fromCharCode(b);
  return btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/g,'');
}
const __integrityCallbacks=new Map();
let __integrityListenerInstalled=false;

function integrityBridge(){
  const bridge=window.PredictUGIntegrity;
  if(!bridge||typeof bridge.postMessage!=='function')return null;
  if(!__integrityListenerInstalled){
    bridge.onmessage=event=>{
      let data=null;
      try{data=JSON.parse(String(event?.data||'{}'))}catch{return}
      const callbackId=String(data?.callback_id||'');
      const entry=__integrityCallbacks.get(callbackId);
      if(!entry)return;
      __integrityCallbacks.delete(callbackId);
      clearTimeout(entry.timer);
      entry.resolve(data||{});
    };
    __integrityListenerInstalled=true;
  }
  return bridge;
}

function integrityBridgeCall(action,payload={},timeoutMs=3500){
  const bridge=integrityBridge();
  if(!bridge)return Promise.resolve({configured:false,ready:false,error:'bridge_unavailable'});
  const callbackId='pi-'+crypto.randomUUID();
  return new Promise(resolve=>{
    const timer=setTimeout(()=>{
      __integrityCallbacks.delete(callbackId);
      resolve({configured:false,ready:false,error:'timeout'});
    },timeoutMs);
    __integrityCallbacks.set(callbackId,{resolve,timer});
    try{
      bridge.postMessage(JSON.stringify({action,callback_id:callbackId,...payload}));
    }catch(e){
      clearTimeout(timer);
      __integrityCallbacks.delete(callbackId);
      resolve({configured:false,ready:false,error:'bridge_post_failed'});
    }
  });
}

async function paymentIntegrityProof(action,payload){
  const material={action,...payload};
  const digest=new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(integrityCanonical(material))));
  const request_hash=integrityBase64Url(digest);

  try{
    let status=await integrityBridgeCall('status',{},1800);
    if(!status?.configured)return {request_hash};

    if(!status?.ready){
      await integrityBridgeCall('prepare',{},1800);
      for(let i=0;i<8;i++){
        await new Promise(r=>setTimeout(r,350));
        status=await integrityBridgeCall('status',{},1800);
        if(status?.ready)break;
      }
    }
    if(!status?.ready)return {request_hash};

    const result=await integrityBridgeCall('token',{request_hash},10000);
    return result?.token?{request_hash,integrity_token:result.token}:{request_hash};
  }catch(e){
    reportClientError(e.message||'Play Integrity bridge failed',e.stack||'',{kind:'play_integrity'});
    return {request_hash};
  }
}
async function paymentApi(action,payload={}){
  if(!state.online)throw new Error('Offline: reconnect before starting or changing a payment.');
  if(!state.session?.access_token)throw new Error('Sign in first');
  const integrity=await paymentIntegrityProof(action,payload);
  const res=await fetch(SUPABASE_URL+'/functions/v1/predict-ug-payments',{
    method:'POST',
    headers:{'content-type':'application/json','authorization':'Bearer '+state.session.access_token},
    body:JSON.stringify({action,...payload,...integrity}),
    signal:rpcTimeoutSignal(20000)
  });
  const data=await res.json();
  if(!res.ok)throw new Error(data.error||'Payment request failed');
  return data;
}

async function merchantPasskeyRequest(type, payload = {}) {
  if (!state.session?.access_token) throw new Error('Sign in as an administrator first');
  const response = await fetch(SUPABASE_URL + '/functions/v1/merchant-momo-ingest', {
    method: 'POST',
    headers: { 'content-type': 'application/json', apikey: SUPABASE_KEY, authorization: 'Bearer ' + state.session.access_token },
    body: JSON.stringify({ type, ...payload }),
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error || 'Merchant passkey request failed');
  return data;
}
function merchantPasskeyBytes(value) {
  const text = String(value);
  const padded = text.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((text.length + 3) % 4);
  const raw = atob(padded);
  return Uint8Array.from(raw, ch => ch.charCodeAt(0));
}
function merchantPasskeyB64(value) {
  const bytes = new Uint8Array(value); let raw = '';
  for (const byte of bytes) raw += String.fromCharCode(byte);
  return btoa(raw).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
}
async function registerMerchantPasskey() {
  try {
    if (!window.PublicKeyCredential || !navigator.credentials) throw new Error('This browser does not support passkeys');
    const options = await merchantPasskeyRequest('passkey_register_options');
    const credential = await navigator.credentials.create({ publicKey: {
      ...options,
      challenge: merchantPasskeyBytes(options.challenge),
      user: { ...options.user, id: merchantPasskeyBytes(options.user.id) },
      excludeCredentials: (options.excludeCredentials || []).map(item => ({ ...item, id: merchantPasskeyBytes(item.id) })),
    }});
    if (!credential) throw new Error('Passkey registration was cancelled');
    const response = credential.response;
    await merchantPasskeyRequest('passkey_register_verify', { challenge_id: options.challenge_id, response: {
      id: credential.id, rawId: merchantPasskeyB64(credential.rawId), type: credential.type,
      authenticatorAttachment: credential.authenticatorAttachment || undefined,
      clientExtensionResults: credential.getClientExtensionResults ? credential.getClientExtensionResults() : {},
      response: { clientDataJSON: merchantPasskeyB64(response.clientDataJSON), attestationObject: merchantPasskeyB64(response.attestationObject), transports: response.getTransports ? response.getTransports() : [] },
    }});
    toast('Merchant admin passkey registered');
  } catch (error) { toast(error.message || 'Could not register the merchant passkey', true); }
}
async function runMerchantPasskeyAdminAction(action,payload) {
  if (!window.PublicKeyCredential || !navigator.credentials) throw new Error('This browser does not support passkeys');
  const options = await merchantPasskeyRequest('passkey_admin_action_options', { action, payload });
  const credential = await navigator.credentials.get({ publicKey: {
    ...options,
    challenge: merchantPasskeyBytes(options.challenge),
    allowCredentials: (options.allowCredentials || []).map(item => ({ ...item, id: merchantPasskeyBytes(item.id) })),
  }});
  if (!credential) throw new Error('Passkey confirmation was cancelled');
  const response = credential.response;
  return merchantPasskeyRequest('passkey_admin_action_execute', {
    action, payload, challenge_id: options.challenge_id, response: {
      id: credential.id, rawId: merchantPasskeyB64(credential.rawId), type: credential.type,
      authenticatorAttachment: credential.authenticatorAttachment || undefined,
      clientExtensionResults: credential.getClientExtensionResults ? credential.getClientExtensionResults() : {},
      response: {
        clientDataJSON: merchantPasskeyB64(response.clientDataJSON),
        authenticatorData: merchantPasskeyB64(response.authenticatorData),
        signature: merchantPasskeyB64(response.signature),
        userHandle: response.userHandle ? merchantPasskeyB64(response.userHandle) : null,
      },
    },
  });
}

  const connectAiKey=async(rawKey)=>{
    const key=String(rawKey||'').trim();
    let provider='';
    if(key.startsWith('gsk_'))provider='groq';
    else if(key.startsWith('sk-or-v1-'))provider='openrouter';
    else if(key.startsWith('AIza'))provider='gemini';
    if(!provider)throw new Error('Could not recognize this API key. Use Groq, OpenRouter or Gemini.');
    const p=(state.aiProviders||[]).find(x=>x.provider===provider)||{};
    await rpc('admin_set_ai_provider',{
      p_provider:provider,
      p_api_key:key,
      p_model:p.model||null,
      p_account_id:null,
      p_enabled:true
    });
    const token=state.session?.access_token;
    if(!token)throw new Error('Sign in again');
    const res=await fetch(SUPABASE_URL+'/functions/v1/market-intelligence-agent',{
      method:'POST',
      headers:{'content-type':'application/json','authorization':'Bearer '+token},
      body:JSON.stringify({action:'test_provider',provider})
    });
    const data=await res.json().catch(()=>({}));
    if(!res.ok||!data.ok)throw new Error(String(data.error||'Provider saved but connection test failed'));
    return {provider,model:data.model||p.model||'',ok:true};
  };

function passwordLooksStrong(password){
  return typeof password==='string'&&password.length>=8&&password.length<=128;
}

function normalizePhone(value){
  let s=String(value||'').trim().replace(/[\s()-]/g,'');
  if(s.startsWith('00'))s='+'+s.slice(2);
  if(/^0\d{9}$/.test(s))s='+256'+s.slice(1);
  else if(/^256\d{9}$/.test(s))s='+'+s;
  return /^\+[1-9]\d{7,14}$/.test(s)?s:'';
}
function authIdentifier(value){
  const phone=normalizePhone(value);
  return phone?{type:'phone',value:phone}:null;
}
function userIdentifier(user){
  const phone=normalizePhone(user?.user_metadata?.phone_login||user?.phone||'');
  return phone?{type:'phone',value:phone}:null;
}
async function phonePasswordRequest(phone,password,action='signin'){
  const res=await fetch(SUPABASE_URL+'/functions/v1/secure-signup',{
    method:'POST',
    headers:{'content-type':'application/json'},
    body:JSON.stringify({phone,password,action})
  });
  const data=await res.json().catch(()=>({}));
  if(!res.ok)throw new Error(data.error||'Authentication failed');
  return data;
}
async function applyReturnedSession(data){
  if(!data?.session?.access_token||!data?.session?.refresh_token)throw new Error('Could not start your session');
  const {error}=await supabase.auth.setSession({
    access_token:data.session.access_token,
    refresh_token:data.session.refresh_token
  });
  if(error)throw error;
}

function trustedApkDownload(value){
  try{
    const u=new URL(String(value||''),PUBLIC_ORIGIN);
    if(u.protocol==='https:'&&u.host==='predict-ug-app.onrender.com'&&u.pathname.startsWith('/downloads/')){
      return u.toString();
    }
  }catch{}
  return PUBLIC_ORIGIN+'/downloads/predict-ug.apk';
}
async function fetchReleaseMetadata(){
  const r=await fetch(INSTALL_ORIGIN+'?release=1&t='+Date.now(),{cache:'no-store'});
  if(!r.ok)throw new Error('Could not check for app updates');
  const meta=await r.json();
  const code=Number(meta?.versionCode||0);
  if(!Number.isSafeInteger(code)||code<1)throw new Error('Update information is invalid');
  return meta;
}
async function checkForAppUpdate(interactive=false){
  if(!state.online){
    if(interactive)toast('Offline: reconnect to check for updates.',true);
    return null;
  }
  try{
    const meta=await fetchReleaseMetadata();
    const latestCode=Number(meta.versionCode||0);
    const newer=latestCode>APP_VERSION_CODE;
    state.releaseUpdate=newer?meta:null;
    if(newer){
      const version=String(meta.version||'new version');
      if(interactive){
        if(confirm('Predict UG '+version+' is available. Open the verified APK download?')){
          location.href=trustedApkDownload(meta.canonicalDownload);
        }
      }else{
        const key='predict_ug_update_notice_'+latestCode;
        try{
          if(localStorage.getItem(key)!=='1'){
            localStorage.setItem(key,'1');
            toast('Predict UG '+version+' is available · Profile → Update app');
          }
        }catch{}
      }
    }else if(interactive){
      toast('Predict UG '+APP_BUILD+' is up to date');
    }
    return meta;
  }catch(e){
    if(interactive)toast(e.message||'Could not check for updates',true);
    return null;
  }
}
async function forceAppUpdate(){
  return checkForAppUpdate(true);
}
async function runAppCheck(){
  const out=[];
  try{
    const r=await fetch(INSTALL_ORIGIN+'?health=1&t='+Date.now(),{cache:'no-store'});
    const h=await r.json();
    out.push(h?.ok?'Backend: online':'Backend: problem');
  }catch{out.push('Backend: offline')}
  try{
    const s=await supabase.auth.getSession();
    out.push(s.data?.session?'Session: signed in':'Session: signed out');
  }catch{out.push('Session: check failed')}
  try{
    const meta=await fetchReleaseMetadata();
    out.push(Number(meta.versionCode)>APP_VERSION_CODE
      ?('Update: '+String(meta.version||'new version')+' available')
      :('App: Android '+APP_BUILD+' · latest'));
  }catch{
    out.push('App: Android '+APP_BUILD+' · update check unavailable');
  }
  return out.join(' · ');
}

<script>
/* Measure the actual phone header and visual viewport, including keyboard resize. */
(function(){
  const root=document.documentElement,bar=document.querySelector('.topbar'),overlay=document.getElementById('overlay');
  const measure=()=>{
    if(bar)root.style.setProperty('--topbar-height',Math.ceil(bar.getBoundingClientRect().height)+'px');
    const height=window.visualViewport?.height||window.innerHeight;
    root.style.setProperty('--visible-height',Math.round(height)+'px');
  };
  if(window.ResizeObserver&&bar)new ResizeObserver(measure).observe(bar);
  window.addEventListener('resize',measure);
  window.visualViewport?.addEventListener('resize',measure);
  new MutationObserver(()=>{
    const open=!!overlay.querySelector('.modal');
    root.classList.toggle('sheet-open',open);
    overlay.querySelectorAll('.sheet').forEach(sheet=>{
      sheet.setAttribute('role','dialog');sheet.setAttribute('aria-modal','true');
      sheet.querySelectorAll('button.close').forEach(button=>button.setAttribute('aria-label','Close dialog'));
    });
    measure();
  }).observe(overlay,{childList:true,subtree:true});
  if(bar)bar.querySelector('#refreshBtn')?.setAttribute('aria-label','Refresh markets');
  measure();
})();
</script>
