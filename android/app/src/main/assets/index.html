window.__predictUgShowStartupFailure=function(message){

  if(!view)return;
  const box=document.createElement('div');
  box.className='empty';
  const title=document.createElement('h2');title.textContent='Predict UG startup problem';
  const msg=document.createElement('p');msg.textContent=String(message||'Startup timed out.').slice(0,280);
  const retry=document.createElement('button');retry.className='btn primary';retry.textContent='Retry';retry.onclick=function(){location.reload()};
  const reset=document.createElement('button');reset.className='btn ghost';reset.style.marginLeft='8px';reset.textContent='Reset saved session';
  reset.onclick=function(){
    try{
      for(let i=localStorage.length-1;i>=0;i--){
        const k=localStorage.key(i)||'';
        if(k.startsWith('sb-')&&k.includes('auth-token'))localStorage.removeItem(k);
      }
      sessionStorage.removeItem('predictug_auth_recovery_once');
    }catch{}
    location.reload();
  };
  box.append(title,msg,retry,reset);view.replaceChildren(box);
};
window.addEventListener('error',function(e){

});
window.addEventListener('unhandledrejection',function(e){
  const r=e&&e.reason;window.__predictUgShowStartupFailure(r&&r.message?r.message:'Startup request failed');
});
window.__predictUgBootTimer=setTimeout(function(){
  window.__predictUgShowStartupFailure('Startup took too long. Retry, or reset the saved session if this started after an update.');
},12000);

  if(marketRealtimeChannel){const channel=marketRealtimeChannel;marketRealtimeChannel=null;try{supabase.removeChannel(channel)}catch{}}
  state.realtimeStatus='idle';state.realtimeMarketId=null;
}
async function refreshOpenMarketLive(id){
  if(!state.online||!state.market?.market||state.market.market.id!==id)return;
  try{
    const watched=!!state.market.__watched;
    const page=await rpc('market_page',{p_market_id:id});
    page.__watched=watched;page.__offline_cache=false;state.market=page;cacheWrite('market:'+id,page);
    if(isClosed(page.market)){stopMarketRealtime()}
    drawMarket();
  }catch(e){reportClientError(e.message||'Realtime market refresh failed',e.stack||'',{kind:'realtime_market_refresh',market_id:id})}
}
function scheduleMarketLiveRefresh(id){
  if(!state.online||state.market?.market?.id!==id)return;
  if(marketRealtimeTimer)clearTimeout(marketRealtimeTimer);
  marketRealtimeTimer=setTimeout(()=>{marketRealtimeTimer=null;refreshOpenMarketLive(id)},300);
}
function scheduleRealtimeFallback(id,delay=15000){
  if(marketRealtimeFallbackTimer)clearTimeout(marketRealtimeFallbackTimer);
  marketRealtimeFallbackTimer=setTimeout(async()=>{
    marketRealtimeFallbackTimer=null;
    if(!state.online||state.market?.market?.id!==id||isClosed(state.market.market))return;
    if(state.realtimeStatus!=='live'){await refreshOpenMarketLive(id);if(state.market?.market?.id===id&&!isClosed(state.market.market))scheduleRealtimeFallback(id,20000)}
  },delay);
}
function startMarketRealtime(id){
  stopMarketRealtime();
  if(!state.online||!id||!state.market?.market||state.market.market.id!==id||isClosed(state.market.market))return;
  state.realtimeStatus='connecting';state.realtimeMarketId=id;scheduleRealtimeFallback(id,12000);
  const channel=supabase.channel('predict-market-live:'+id)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'market_live_events',filter:'market_id=eq.'+id},()=>scheduleMarketLiveRefresh(id))
    .subscribe(status=>{
      if(state.realtimeMarketId!==id)return;
      if(status==='SUBSCRIBED'){state.realtimeStatus='live';if(marketRealtimeFallbackTimer){clearTimeout(marketRealtimeFallbackTimer);marketRealtimeFallbackTimer=null}if(state.market?.market?.id===id)drawMarket()}
      else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'){state.realtimeStatus='reconnecting';scheduleRealtimeFallback(id,2500);if(state.market?.market?.id===id)drawMarket()}
      else if(status==='CLOSED'){state.realtimeStatus='idle'}
    });
  marketRealtimeChannel=channel;
}
function rpcNeedsNetworkMutationGuard(name){
  const n=String(name||'');
  return /^(place_|cancel_|cash_out_|request_|set_|settle_|void_|create_|accept_|delete_|update_|save_|challenge_)/.test(n) ||
    /^(admin_.*(?:create|set|add|publish|propose|review|clear|update|pair|revoke)|mark_)/.test(n);
}
function rpcTimeoutSignal(ms){
  if(typeof AbortSignal!=='undefined'&&typeof AbortSignal.timeout==='function'){
    return AbortSignal.timeout(ms);
  }
  const controller=new AbortController();
  setTimeout(()=>controller.abort(),ms);
  return controller.signal;
}
function rpcReadRetryable(error){
  const code=String(error?.code||'').toUpperCase();
  const msg=String(error?.message||error||'').toLowerCase();
  if(code==='42501'||code.startsWith('23')||code.startsWith('PGRST1')||code.startsWith('PGRST2'))return false;
  return code.startsWith('08')
    ||code.startsWith('53')
    ||['PGRST000','PGRST001','PGRST002','PGRST003'].includes(code)
    ||/timeout|timed out|network|failed to fetch|fetch failed|aborted|connection/.test(msg);
}
async function rpc(name,args={}){
  const mutating=rpcNeedsNetworkMutationGuard(name);
  if(!state.online&&mutating){
    throw new Error('Offline: reconnect before changing markets, orders, account data or money.');
  }
  const maxAttempts=mutating?1:3;
  let lastError=null;
  for(let attempt=0;attempt<maxAttempts;attempt++){
    const timeoutMs=mutating?15000:8000;
    try{
      const rpcClient=(!mutating&&!state.user)?publicSupabase:supabase;
      const query=rpcClient.rpc(name,args).abortSignal(rpcTimeoutSignal(timeoutMs));
      const {data,error}=await query;
      if(!error)return data;
      lastError=error;
    }catch(error){
      lastError=error;
    }
    if(mutating||!state.online||!rpcReadRetryable(lastError)||attempt===maxAttempts-1)break;
    await new Promise(resolve=>setTimeout(resolve,attempt===0?300:850));
  }
  throw lastError||new Error('Predict UG request failed');
}

    await fetch(SUPABASE_URL+'/functions/v1/client-error-report',{

      body:JSON.stringify({source:'web',app_version:APP_BUILD,message:String(message||'Unknown client error').slice(0,700),stack:String(stack||'').slice(0,4000),context:{tab:state.tab,online:state.online,...context}})
    });
  }catch{}finally{__reportingClientError=false}
}

async function openMarket(id,{updateUrl=true}={}){
  const key='market:'+id;
  let page=null;
  try{
    page=await rpc('market_page',{p_market_id:id});
    page.__offline_cache=false;
    if(state.user&&state.online){
      try{
        const {data:user}=await supabase.auth.getUser();
        const uid=user.user?.id;
        const {data:ex}=await supabase.from('watchlist').select('id').eq('user_id',uid).eq('market_id',id).maybeSingle();
        page.__watched=!!ex;
      }catch{page.__watched=false}
    }else page.__watched=false;
    cacheWrite(key,page);
  }catch(e){
    const cached=cacheRead(key);
    if(!cached){toast(e.message||'Could not open market',true);return}
    page={...(cached.value||{}),__offline_cache:true,__offline_saved_at:cached.saved_at};
    toast('Offline: showing last synced market ('+cachedAgeLabel(cached)+')');
  }
  state.market=page;
  trackBehavior('market_view',{category:page?.market?.category||page?.market?.category_key,marketId:id});
  if(updateUrl&&linkedMarketId()!==id)setMarketUrl(id);
  drawMarket();
  if(state.online&&!isClosed(page.market))startMarketRealtime(id);else stopMarketRealtime();
}
function historySvg(d){
  const outs=d?.outcomes||[];const yes=outs.find(o=>String(o.label).toUpperCase()==='YES');if(!yes)return '<div class="empty">No chart data.</div>';
  const pts=(d.history||[]).filter(x=>x.outcome_id===yes.id).map(x=>Number(x.display_probability));
  if(pts.length<2)return '<div class="empty">Probability history will appear as trades arrive.</div>';
  const w=600,h=135,p=8;const min=0,max=100;
  const xy=pts.map((v,i)=>[(i/(pts.length-1))*(w-p*2)+p,h-p-((v-min)/(max-min))*(h-p*2)]);
  const path=xy.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><path d="'+path+'" fill="none" stroke="#33d69f" stroke-width="3" vector-effect="non-scaling-stroke"/><line x1="0" y1="'+h/2+'" x2="'+w+'" y2="'+h/2+'" stroke="#203957" stroke-dasharray="5 5"/></svg>';
}

async function showAdvancedBuy(m,outcome){
  if(!state.online){toast('Offline: reconnect before placing an order.',true);return}
  if(!state.user){showAuth();return}
  if(!outcome?.id){toast('Outcome unavailable',true);return}
  try{
    const book=await rpc('secondary_orderbook',{p_market_id:m.id,p_outcome_id:outcome.id});
    const bestBid=book?.bids?.[0];
    const bestAsk=book?.asks?.[0];
    const box=$('#advancedBook');
    if(box){
      box.innerHTML=
        '<div class="quote-row"><span>Selected</span><b>'+esc(outcome.label)+'</b></div>'+
        '<div class="quote-row"><span>Best buyer</span><b>'+(bestBid?ugx(bestBid.price_per_1000_ugx)+' / 1,000':'None yet')+'</b></div>'+
        '<div class="quote-row"><span>Best seller</span><b>'+(bestAsk?ugx(bestAsk.price_per_1000_ugx)+' / 1,000':'None yet')+'</b></div>'+
        '<div class="quote-row"><span>Recent trades</span><b>'+Number(book?.recent_fills?.length||0)+'</b></div>';
    }

    if(!confirm('Advanced '+outcome.label+' trading\n\nThe order book is shown below. Place a limit BUY order?'))return;

    const qty=Number(prompt('How much '+outcome.label+' position do you want? Use 1,000 steps.','5000')||0);
    if(qty<1000||qty%1000!==0){
      toast('Use 1,000-unit steps',true);
      return;
    }

    const suggested=bestAsk?.price_per_1000_ugx||bestBid?.price_per_1000_ugx||'';
    const price=Number(prompt(
      'Maximum price for each 1,000 of position.'+
      (bestAsk?' Best seller asks '+ugx(bestAsk.price_per_1000_ugx)+'.':''),
      String(suggested)
    )||0);
    if(price<=0)return;

    const reserve=Math.ceil(qty*price/1000);
    if(!confirm('Reserve up to '+ugx(reserve)+' for this advanced order?'))return;

    const result=await rpc('place_secondary_order',{
      p_market_id:m.id,
      p_outcome_id:outcome.id,
      p_side:'buy',
      p_quantity_stake_ugx:qty,
      p_price_per_1000_ugx:price,
      p_idempotency_key:'web-limit-buy-'+crypto.randomUUID(),
      p_source_position_id:null
    });

    const order=result?.result?.order||{};
    toast(order.status==='filled'?'Advanced order filled':'Advanced order placed');
    if(box){
      const fresh=await rpc('secondary_orderbook',{p_market_id:m.id,p_outcome_id:outcome.id});
      const bid=fresh?.bids?.[0],ask=fresh?.asks?.[0];
      box.innerHTML=
        '<div class="quote-row"><span>Best buyer</span><b>'+(bid?ugx(bid.price_per_1000_ugx)+' / 1,000':'None')+'</b></div>'+
        '<div class="quote-row"><span>Best seller</span><b>'+(ask?ugx(ask.price_per_1000_ugx)+' / 1,000':'None')+'</b></div>'+
        '<div class="quote-row"><span>Your order</span><b>'+esc(order.status||'placed')+'</b></div>';
    }
  }catch(e){
    toast(e.message||'Advanced order failed',true);
  }
}

const SHARED_CLAIM_KEY='predictug_pending_shared_claim_v1';
function sharedClaimPlatform(value){
  const text=String(value||'').toLowerCase();
  if(/(?:^|\W)(?:x\.com|twitter\.com)(?:\W|$)/.test(text))return 'x';
  if(text.includes('tiktok.com'))return 'tiktok';
  if(text.includes('instagram.com'))return 'instagram';
  if(text.includes('youtube.com')||text.includes('youtu.be'))return 'youtube';
  if(text.includes('facebook.com')||text.includes('fb.watch'))return 'facebook';
  if(text.includes('whatsapp'))return 'whatsapp_status';
  return 'other';
}
function savePendingSharedClaim(payload){
  const p=payload&&typeof payload==='object'?payload:{text:String(payload||'')};
  const text=String(p.text||'').trim().slice(0,6000);
  if(!text)return false;
  const saved={text,platform:String(p.platform||sharedClaimPlatform(text)||'other'),title:String(p.title||'').slice(0,240),source:String(p.source||'shared'),received_at_ms:Number(p.received_at_ms||Date.now())};
  try{localStorage.setItem(SHARED_CLAIM_KEY,JSON.stringify(saved));return true}catch{return false}
}
function readPendingSharedClaim(){
  try{
    const raw=localStorage.getItem(SHARED_CLAIM_KEY);
    if(!raw)return null;
    const p=JSON.parse(raw);
    if(!p||!String(p.text||'').trim())return null;
    return p;
  }catch{return null}
}
function clearPendingSharedClaim(){
  try{localStorage.removeItem(SHARED_CLAIM_KEY)}catch{}
}
function maybeOpenPendingSharedClaim(){
  const p=readPendingSharedClaim();
  if(!p||!state.user)return false;
  clearPendingSharedClaim();
  state.tab='media';
  render();
  setTimeout(()=>showSocialClaimChecker(p),0);
  return true;
}
window.__predictUgReceiveSharedClaim=(payload)=>{
  if(!savePendingSharedClaim(payload))return false;
  if(state.user)maybeOpenPendingSharedClaim();
  else toast('Shared post received. Sign in to analyze it.');
  return true;
};

async function showSocialClaimChecker(prefill={}){
  const prefillText=String(prefill?.text||'').trim().slice(0,6000);
  if(!state.user){
    if(prefillText)savePendingSharedClaim(prefill);
    showAuth();
    return;
  }
  if(!state.user){showAuth();return}
  $('#overlay').innerHTML=
    '<div class="modal"><div class="sheet" style="max-width:620px">'+
      '<button class="close" id="claimCheckClose">✕</button>'+
      '<div class="media-label">Predict UG claim checker</div>'+
      '<h2>Check a social post</h2>'+
      '<p class="auth-note">Paste text from a status, screenshot or public post. Predict UG will split it into claims and show what still needs verification. User-shared context is retained for 7 days and is never automatic market or settlement evidence.</p>'+
      '<div class="auth-wrap">'+
        '<label class="auth-note">Source</label>'+
        '<select class="input" id="claimCheckPlatform">'+
          '<option value="whatsapp_status">WhatsApp status</option>'+
          '<option value="screenshot">Screenshot</option>'+
          '<option value="x">X / Twitter</option>'+
          '<option value="tiktok">TikTok</option>'+
          '<option value="instagram">Instagram</option>'+
          '<option value="youtube">YouTube</option>'+
          '<option value="facebook">Facebook</option>'+
          '<option value="website">Website</option>'+
          '<option value="other">Other</option>'+
        '</select>'+
        '<label class="auth-note">Paste the post text</label>'+
        '<textarea class="input" id="claimCheckText" rows="8" maxlength="6000" placeholder="Paste the text here…"></textarea>'+
        '<button class="btn primary" id="claimCheckRun">Analyze claims</button>'+
      '</div>'+
      '<div id="claimCheckResults" style="margin-top:14px"></div>'+
    '</div></div>';
  const initialPlatform=String(prefill?.platform||sharedClaimPlatform(prefillText)||'other');
  if($('#claimCheckText')&&prefillText)$('#claimCheckText').value=prefillText;
  if($('#claimCheckPlatform')&&[...$('#claimCheckPlatform').options].some(o=>o.value===initialPlatform)){
    $('#claimCheckPlatform').value=initialPlatform;
  }
  $('#claimCheckClose').onclick=()=>{$('#overlay').innerHTML=''};
  $('#claimCheckRun').onclick=async()=>{
    const btn=$('#claimCheckRun');
    const textValue=String($('#claimCheckText').value||'').trim();
    const platform=String($('#claimCheckPlatform').value||'other');
    if(textValue.length<10){toast('Paste at least 10 characters',true);return}
    btn.disabled=true;btn.textContent='Checking…';
    try{
      const result=await rpc('submit_social_claim_text',{
        p_source_platform:platform,
        p_text:textValue,
        p_public_url:null,
        p_privacy_scope:'user_shared_context'
      });
      const claims=Array.isArray(result?.claims)?result.claims:[];
      const target=$('#claimCheckResults');
      target.innerHTML=
        '<div class="section-title"><h2 style="font-size:1.05rem">Detected claims</h2><span class="statuschip">'+claims.length+' found</span></div>'+
        (claims.length?'<div class="timeline">'+claims.map(x=>
          '<div class="item"><b>'+esc(String(x.claim_type||'claim').replaceAll('_',' '))+
          (x.claimed_value!=null?' · '+esc(String(x.claimed_value))+' '+esc(x.claimed_unit||''):'')+
          '</b><br><span>'+esc(short(x.claim_text||''))+'</span><br><small>'+
          esc(String(x.verification_status||'unverified').replaceAll('_',' '))+
          (x.authoritative_source_id?' · check '+esc(String(x.authoritative_source_id).replaceAll('-',' ')):'')+
          ' · '+esc(String(x.market_eligibility||'context_only').replaceAll('_',' '))+
          '</small>'+
          (x.authoritative_value!=null?'<br><small><b>Official reference:</b> '+esc(String(x.authoritative_value))+' '+esc(x.authoritative_unit||'')+'</small>':'')+
          (x.evidence_note?'<br><small>'+esc(x.evidence_note)+'</small>':'')+
          '</div>'
        ).join('')+'</div>':'<div class="empty">No measurable claim was detected in that text.</div>')+
        '<p class="auth-note">This analysis is private user-shared context. It does not publish a market or settle anything automatically.</p>'+
        '<button class="btn ghost" id="claimDeleteNow">Delete this analysis now</button>';
      const del=$('#claimDeleteNow');
      if(del)del.onclick=async()=>{
        try{
          await rpc('delete_my_social_claim_submission',{p_submission_id:result.submission_id});
          $('#overlay').innerHTML='';toast('Claim analysis deleted');
        }catch(e){toast(e.message||'Could not delete analysis',true)}
      };
    }catch(e){
      toast(e.message||'Claim analysis failed',true);
    }finally{
      if(btn){btn.disabled=false;btn.textContent='Analyze claims'}
    }
  };
}

    const q=await rpc('secondary_cashout_quote',{

      p_quantity_stake_ugx:max
    });
    const fill=Number(q.fillable_stake_ugx||0);
    const proceeds=Number(q.estimated_cashout_ugx||0);

    if(fill<1000){
      toast('No buyer is ready right now. Use Advanced offer if you want to set your own price.',true);
      return;
    }

    const action=q.mode==='cash'?'Cash Out':'Exit Prediction';
    const partial=fill<max
      ?'A buyer can take '+ugx(fill)+' of your '+ugx(max)+' position right now.'
      :'Your full available position can be taken right now.';
    const receive=q.mode==='cash'
      ?'You receive about '+ugx(proceeds)+'.'
      :'You receive about '+ugx(proceeds)+' prediction credits.';

    if(!confirm(action+'\n\n'+partial+'\n'+receive+'\n\nContinue?'))return;

    const result=await rpc('cash_out_position_now',{
      p_source_position_id:pos.position_id,
      p_quantity_stake_ugx:fill,
      p_idempotency_key:'web-cashout-'+crypto.randomUUID()
    });

    toast((q.mode==='cash'?'Cash out':'Exit')+' completed: '+ugx(result.proceeds_ugx||0));
    await loadPortfolio();
    render();
  }catch(e){
    toast(e.message||'Could not exit prediction',true);
  }
}

function integrityCanonical(value){
  if(value===null||typeof value!=='object')return JSON.stringify(value);
  if(Array.isArray(value))return '['+value.map(integrityCanonical).join(',')+']';
  return '{'+Object.keys(value).sort().map(k=>JSON.stringify(k)+':'+integrityCanonical(value[k])).join(',')+'}';
}
function integrityBase64Url(bytes){
  let binary='';for(const b of bytes)binary+=String.fromCharCode(b);
  return btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/g,'');
}
const __integrityCallbacks=new Map();
let __integrityListenerInstalled=false;

function integrityBridge(){
  const bridge=window.PredictUGIntegrity;
  if(!bridge||typeof bridge.postMessage!=='function')return null;
  if(!__integrityListenerInstalled){
    bridge.onmessage=event=>{
      let data=null;
      try{data=JSON.parse(String(event?.data||'{}'))}catch{return}
      const callbackId=String(data?.callback_id||'');
      const entry=__integrityCallbacks.get(callbackId);
      if(!entry)return;
      __integrityCallbacks.delete(callbackId);
      clearTimeout(entry.timer);
      entry.resolve(data||{});
    };
    __integrityListenerInstalled=true;
  }
  return bridge;
}

function integrityBridgeCall(action,payload={},timeoutMs=3500){
  const bridge=integrityBridge();
  if(!bridge)return Promise.resolve({configured:false,ready:false,error:'bridge_unavailable'});
  const callbackId='pi-'+crypto.randomUUID();
  return new Promise(resolve=>{
    const timer=setTimeout(()=>{
      __integrityCallbacks.delete(callbackId);
      resolve({configured:false,ready:false,error:'timeout'});
    },timeoutMs);
    __integrityCallbacks.set(callbackId,{resolve,timer});
    try{
      bridge.postMessage(JSON.stringify({action,callback_id:callbackId,...payload}));
    }catch(e){
      clearTimeout(timer);
      __integrityCallbacks.delete(callbackId);
      resolve({configured:false,ready:false,error:'bridge_post_failed'});
    }
  });
}

async function paymentIntegrityProof(action,payload){
  const material={action,...payload};
  const digest=new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(integrityCanonical(material))));
  const request_hash=integrityBase64Url(digest);

  try{
    let status=await integrityBridgeCall('status',{},1800);
    if(!status?.configured)return {request_hash};

    if(!status?.ready){
      await integrityBridgeCall('prepare',{},1800);
      for(let i=0;i<8;i++){
        await new Promise(r=>setTimeout(r,350));
        status=await integrityBridgeCall('status',{},1800);
        if(status?.ready)break;
      }
    }
    if(!status?.ready)return {request_hash};

    const result=await integrityBridgeCall('token',{request_hash},10000);
    return result?.token?{request_hash,integrity_token:result.token}:{request_hash};
  }catch(e){
    reportClientError(e.message||'Play Integrity bridge failed',e.stack||'',{kind:'play_integrity'});
    return {request_hash};
  }
}
async function paymentApi(action,payload={}){
  if(!state.online)throw new Error('Offline: reconnect before starting or changing a payment.');
  if(!state.session?.access_token)throw new Error('Sign in first');
  const integrity=await paymentIntegrityProof(action,payload);
  const res=await fetch(SUPABASE_URL+'/functions/v1/predict-ug-payments',{
    method:'POST',
    headers:{'content-type':'application/json','authorization':'Bearer '+state.session.access_token},
    body:JSON.stringify({action,...payload,...integrity}),
    signal:rpcTimeoutSignal(20000)
  });
  const data=await res.json();
  if(!res.ok)throw new Error(data.error||'Payment request failed');
  return data;
}

function normalizeCashPhone(value){
  const phone=String(value||'').trim();
  if(!phone)return null;
  const digits=phone.replace(/[^0-9+]/g,'');
  if(digits.length<9||digits.length>13)return null;
  return phone;
}

    let provider='';
    if(key.startsWith('gsk_'))provider='groq';
    else if(key.startsWith('sk-or-v1-'))provider='openrouter';
    else if(key.startsWith('AIza'))provider='gemini';
    if(!provider)throw new Error('Could not recognize this API key. Use Groq, OpenRouter or Gemini.');
    const p=(state.aiProviders||[]).find(x=>x.provider===provider)||{};
    await rpc('admin_set_ai_provider',{
      p_provider:provider,
      p_api_key:key,
      p_model:p.model||null,
      p_account_id:null,
      p_enabled:true
    });
    const token=state.session?.access_token;
    if(!token)throw new Error('Sign in again');
    const res=await fetch(SUPABASE_URL+'/functions/v1/market-intelligence-agent',{
      method:'POST',
      headers:{'content-type':'application/json','authorization':'Bearer '+token},
      body:JSON.stringify({action:'test_provider',provider})
    });
    const data=await res.json().catch(()=>({}));
    if(!res.ok||!data.ok)throw new Error(String(data.error||'Provider saved but connection test failed'));

function passwordLooksStrong(password){
  return typeof password==='string'&&password.length>=8&&password.length<=128;
}

function normalizePhone(value){
  let s=String(value||'').trim().replace(/[\s()-]/g,'');
  if(s.startsWith('00'))s='+'+s.slice(2);
  if(/^0\d{9}$/.test(s))s='+256'+s.slice(1);
  else if(/^256\d{9}$/.test(s))s='+'+s;
  return /^\+[1-9]\d{7,14}$/.test(s)?s:'';
}
function authIdentifier(value){
  const phone=normalizePhone(value);
  return phone?{type:'phone',value:phone}:null;
}
function userIdentifier(user){
  const phone=normalizePhone(user?.user_metadata?.phone_login||user?.phone||'');
  return phone?{type:'phone',value:phone}:null;
}
async function phonePasswordRequest(phone,password,action='signin'){
  const res=await fetch(SUPABASE_URL+'/functions/v1/secure-signup',{
    method:'POST',
    headers:{'content-type':'application/json'},
    body:JSON.stringify({phone,password,action})
  });
  const data=await res.json().catch(()=>({}));
  if(!res.ok)throw new Error(data.error||'Authentication failed');
  return data;
}
async function applyReturnedSession(data){
  if(!data?.session?.access_token||!data?.session?.refresh_token)throw new Error('Could not start your session');
  const {error}=await supabase.auth.setSession({
    access_token:data.session.access_token,
    refresh_token:data.session.refresh_token
  });
  if(error)throw error;
}

  $('#overlay').innerHTML=

        '<input class="input" id="confirmPassword" type="password" autocomplete="new-password" placeholder="Confirm new password">'+
        '<button class="btn primary" id="saveNewPassword">Save new password</button>'+
      '</div>'+
    '</div></div>';

  $('#resetClose').onclick=()=>$('#overlay').innerHTML='';

    if(!state.online){toast('Offline: reconnect before changing your password.',true);return}

    if(password!==confirmPassword){toast('Passwords do not match',true);return}

    }

    $('#saveNewPassword').disabled=true;

        method:'POST',
        headers:{'content-type':'application/json'},

      });
      const checkData=await checkRes.json();
      if(!checkRes.ok){
        const extra=Array.isArray(checkData.reasons)&&checkData.reasons.length?' '+checkData.reasons.join('. '):'';
        throw new Error((checkData.error||'Password security check failed')+extra);

  };

function trustedApkDownload(value){
  try{
    const u=new URL(String(value||''),PUBLIC_ORIGIN);
    if(u.protocol==='https:'&&u.host==='predict-ug-app.onrender.com'&&u.pathname.startsWith('/downloads/'))return u.toString();
  }catch{}
  return PUBLIC_ORIGIN+'/downloads/predict-ug.apk';
}
async function fetchReleaseMetadata(){
  const r=await fetch(INSTALL_ORIGIN+'?release=1&t='+Date.now(),{cache:'no-store'});
  if(!r.ok)throw new Error('Could not check for app updates');
  const meta=await r.json();
  const code=Number(meta?.versionCode||0);
  if(!Number.isSafeInteger(code)||code<1)throw new Error('Update information is invalid');
  return meta;
}
async function checkForAppUpdate(interactive=false){
  if(!state.online){if(interactive)toast('Offline: reconnect to check for updates.',true);return null}
  try{
    const meta=await fetchReleaseMetadata();
    const latestCode=Number(meta.versionCode||0), newer=latestCode>APP_VERSION_CODE;
    state.releaseUpdate=newer?meta:null;
    if(newer){
      const v=String(meta.version||'new version');
      if(interactive){if(confirm('Predict UG '+v+' is available. Open the verified APK download?'))location.href=trustedApkDownload(meta.canonicalDownload)}
      else{const key='predict_ug_update_notice_'+latestCode;try{if(localStorage.getItem(key)!=='1'){localStorage.setItem(key,'1');toast('Predict UG '+v+' is available · Profile → Update app')}}catch{}}
    }else if(interactive)toast('Predict UG '+APP_BUILD+' is up to date');
    return meta;
  }catch(e){if(interactive)toast(e.message||'Could not check for updates',true);return null}
}
async function forceAppUpdate(){return checkForAppUpdate(true)}
async function runAppCheck(){
  const out=[];
  try{const r=await fetch(INSTALL_ORIGIN+'?health=1&t='+Date.now(),{cache:'no-store'});const h=await r.json();out.push(h?.ok?'Backend: online':'Backend: problem')}catch{out.push('Backend: offline')}
  try{const s=await supabase.auth.getSession();out.push(s.data?.session?'Session: signed in':'Session: signed out')}catch{out.push('Session: check failed')}
  try{const meta=await fetchReleaseMetadata();out.push(Number(meta.versionCode)>APP_VERSION_CODE?('Update: '+String(meta.version||'new version')+' available'):('App: Android '+APP_BUILD+' · latest'))}catch{out.push('App: Android '+APP_BUILD+' · update check unavailable')}
  return out.join(' · ');
}

  e.preventDefault();

});

});
