function starterMarketCandidate(){
  if(state.status?.offline_cache||state.online===false)return null;
  const quoted=value=>(typeof value==='number'||typeof value==='string')&&String(value).trim()!==''&&Number.isFinite(Number(value))&&Number(value)>1;
  const rows=Array.isArray(state.markets)?state.markets:[];
  const eligible=rows.filter(m=>{
    if(marketQuestionReviewReason(m?.title))return false;
    const close=Date.parse(m?.close_time||'');
    return !!m?.market_id&&!m?.external_benchmark&&
      !isPoliticalCategory(m?.category||m?.category_key)&&
      String(m?.status||'').toLowerCase()==='open'&&
      quoted(m?.yes_odds)&&quoted(m?.no_odds)&&
      Number.isFinite(close)&&close>Date.now();
  });
  const score=m=>{
    const cat=String(m?.category||m?.category_key||'').toLowerCase();
    const title=String(m?.title||'').toLowerCase();
    const verified=String(m?.data_status||'')==='verified';
    const closeMs=Date.parse(m?.close_time||'');
    const days=Number.isFinite(closeMs)?Math.max(0,(closeMs-Date.now())/86400000):999;
    if(/sport|football|soccer/.test(cat+' '+title))return 0;
    if(cat==='weather'&&verified&&days<=7)return 1;
    if(cat==='entertainment'&&days<=14)return 2;
    if(verified&&days<=14)return 3;
    if(cat==='entertainment')return 4;
    if(verified)return 5;
    return 6;
  };
  return eligible.slice().sort((a,b)=>{
    const rank=score(a)-score(b);
    if(rank)return rank;
    const ac=Date.parse(a?.close_time||'')||Number.MAX_SAFE_INTEGER;
    const bc=Date.parse(b?.close_time||'')||Number.MAX_SAFE_INTEGER;
    return ac-bc;
  })[0]||null;
}

function rpcReadRetryable(error){

// One unresolved immutable placement per account. Storage must work before mutation.
const predictionRecovery={
  exclusive(userId,action){
    if(!globalThis.navigator?.locks?.request)throw new Error('Safe prediction recovery requires browser lock support. No prediction was sent.');
    return navigator.locks.request(this.key(userId),{mode:'exclusive'},action);
  },
  key:userId=>'predict-ug:unresolved-prediction:v1:'+userId,
  read(userId){
    const raw=localStorage.getItem(this.key(userId));
    if(raw===null)return null;
    const value=JSON.parse(raw);
    if(value.version!==1||value.snapshot?.userId!==userId||!value.snapshot?.idempotencyKey||!value.quote)throw new Error('Saved prediction needs recovery. Do not place a new prediction.');
    return value;
  },
  save(snapshot,quote){
    const value={version:1,snapshot,quote},raw=JSON.stringify(value),key=this.key(snapshot.userId);
    const old=this.read(snapshot.userId);
    if(old&&JSON.stringify(old)!==raw)throw new Error('Resolve your previous prediction before starting another.');
    localStorage.setItem(key,raw);
    if(localStorage.getItem(key)!==raw)throw new Error('Could not safely save prediction recovery. No prediction was sent.');
  },
  clear(snapshot){
    const old=this.read(snapshot.userId);
    if(old?.snapshot.idempotencyKey===snapshot.idempotencyKey)localStorage.removeItem(this.key(snapshot.userId));
  }
};

async function rpc(name,args={}){
  const mutating=rpcNeedsNetworkMutationGuard(name);
  if(!state.online&&mutating){
    throw new Error('Offline: reconnect before changing markets, orders, account data or money.');
  }
  const maxAttempts=mutating?1:3;
  let lastError=null;
  for(let attempt=0;attempt<maxAttempts;attempt++){
    const timeoutMs=mutating?15000:8000;
    try{
      const rpcClient=(!mutating&&!state.user)?publicSupabase:supabase;
      const query=rpcClient.rpc(name,args).abortSignal(rpcTimeoutSignal(timeoutMs));
      const {data,error}=await query;
      if(!error)return data;
      lastError=error;
    }catch(error){
      lastError=error;
    }
    if(mutating||!state.online||!rpcReadRetryable(lastError)||attempt===maxAttempts-1)break;
    await new Promise(resolve=>setTimeout(resolve,attempt===0?300:850));
  }
  throw lastError||new Error('Predict UG request failed');
}

async function loadSession(){

  if(!current())return false;
  if(result?.error)throw result.error;
  const data=result?.data;
  if(!data||!Object.prototype.hasOwnProperty.call(data,'session')||
     (data.session!==null&&(!data.session||typeof data.session.user?.id!=='string'||!data.session.user.id)))throw new Error('Invalid saved session response');

}

async function ensureLegalAcceptance(surface='startup'){
  const userId=state.user?.id;
  if(!userId)return true;
  const sameUser=()=>state.user?.id===userId;
  const signOutCurrent=async()=>{
    if(!sameUser()||state.legalSignoutPendingUserId===userId)return;
    const btn=$('#legalSignout'),status=$('#legalStatus');
    if(!btn||btn.onclick!==signOutCurrent)return;
    state.legalSignoutPendingUserId=userId;btn.disabled=true;
    let confirmed=false;
    try{
      trackBehavior('legal_gate_signout',{metadata:{surface}});
      const result=await supabase.auth.signOut();
      if(result?.error)throw result.error;
      if(!result||typeof result!=='object'||!Object.prototype.hasOwnProperty.call(result,'error'))throw new Error('Could not verify sign-out');
      confirmed=true;
      if(state.user&&!sameUser())return;
      await loadSession();
      if(state.user&&!sameUser())return;
      if(state.user)throw new Error('The session is still active');
      if($('#legalSignout')!==btn)return;
      $('#overlay').innerHTML='';render();
    }catch(error){
      if(state.user&&!sameUser())return;
      if($('#legalSignout')!==btn)return;
      const message=confirmed?'Signed out, but the screen could not refresh. Tap Update to retry.':'Could not sign out. Check your connection and retry.';
      if(status)status.textContent=message;
      toast(message,true);
    }finally{
      if(state.legalSignoutPendingUserId===userId)state.legalSignoutPendingUserId=null;
      btn.disabled=false;
    }
  };
  try{
    const legal=await rpc('my_legal_acceptance_status');
    if(!sameUser())return false;
    if(legal?.complete===true)return true;
    trackBehavior('legal_gate_shown',{metadata:{surface}});
    $('#overlay').innerHTML=
      '<div class="modal"><div class="sheet" style="max-width:500px">'+
        '<h2>Before you continue</h2>'+
        '<p>Review the Predict UG Terms of Use and Privacy Policy for this public beta.</p>'+
        '<div class="auth-wrap">'+
          '<button class="btn" id="legalTerms">Read Terms of Use</button>'+
          '<button class="btn" id="legalPrivacy">Read Privacy Policy</button>'+
          '<label class="auth-note"><input type="checkbox" id="legalAgree"> I agree to the Terms of Use and acknowledge the Privacy Policy.</label>'+
          '<button class="btn primary" id="legalAccept">Agree & continue</button>'+
          '<button class="btn ghost" id="legalSignout">Sign out</button>'+
          '<div id="legalStatus" class="auth-note"></div>'+
        '</div>'+
      '</div></div>';
    $('#legalTerms').onclick=()=>{trackBehavior('legal_terms_opened',{metadata:{surface}});openHosted('/terms.html')};
    $('#legalPrivacy').onclick=()=>{trackBehavior('legal_privacy_opened',{metadata:{surface}});openHosted('/privacy.html')};
    $('#legalSignout').onclick=signOutCurrent;
    const acceptButton=$('#legalAccept');
    const gateCurrent=()=>sameUser()&&$('#legalAccept')===acceptButton;
    acceptButton.onclick=async()=>{
      if(!gateCurrent())return;
      const status=$('#legalStatus');
      if(!state.online){trackBehavior('legal_acceptance_blocked',{metadata:{reason:'offline'}});status.textContent='Offline: reconnect before accepting legal documents.';return}
      if(!$('#legalAgree').checked){trackBehavior('legal_acceptance_blocked',{metadata:{reason:'agreement_not_checked'}});status.textContent='Tick the agreement box to continue.';return}
      trackBehavior('legal_acceptance_attempted',{metadata:{surface}});
      const btn=$('#legalAccept');btn.disabled=true;status.textContent='Saving…';
      try{
        const saved=await rpc('accept_current_legal_documents',{p_source:'app'});
        if(!gateCurrent())return;
        if(saved?.complete!==true)throw new Error('Acceptance could not be saved');
        trackBehavior('legal_acceptance_completed',{metadata:{surface}});
        $('#overlay').innerHTML='';
        await loadBetaMission();
        if(!sameUser())return;
        render();
        toast('Terms accepted');
        if(surface==='startup')setTimeout(()=>{if(sameUser())maybeShowFirstUseGuide()},180);
      }catch(e){if(!gateCurrent())return;trackBehavior('legal_acceptance_failed',{metadata:{message:String(e?.message||'unknown').slice(0,120)}});status.textContent=e.message||'Could not save acceptance';btn.disabled=false}
    };
    return false;
  }catch(e){
    reportClientError(e.message||'Legal acceptance check failed',e.stack||'',{kind:'legal_acceptance'});
    if(!sameUser())return false;
    $('#overlay').innerHTML=
      '<div class="modal"><div class="sheet" style="max-width:500px">'+
      '<h2>Could not check your agreement</h2><p>Reconnect and retry before continuing. We could not verify your agreement status.</p>'+
      '<div class="auth-wrap"><button class="btn primary" id="legalRetry">Retry</button>'+
      '<button class="btn ghost" id="legalSignout">Sign out</button></div></div></div>';
    $('#legalRetry').onclick=()=>{if(sameUser())return ensureLegalAcceptance(surface)};
    $('#legalSignout').onclick=signOutCurrent;
    return false;
  }
}

async function syncPaymentReturn(){
  // Legacy provider-return parameters are not merchant payment evidence.
  const qs=new URLSearchParams(location.search);
  const paymentKeys=['OrderMerchantReference','orderMerchantReference','payment_intent_id','tx_ref'];
  if(!paymentKeys.some(key=>qs.has(key)))return;
  for(const key of [...paymentKeys,'transaction_id','transactionId'])qs.delete(key);
  const remaining=qs.toString();
  history.replaceState(history.state||{},'',location.pathname+(remaining?'?'+remaining:'')+location.hash);
  toast('A redirect cannot confirm an MTN/Airtel merchant payment. Check payment history; wallet credit requires independently verified merchant evidence.',true);
}

function ugandaDateKey(value){
  const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Africa/Kampala',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(value));
  const get=type=>parts.find(x=>x.type===type)?.value;
  return get('year')+'-'+get('month')+'-'+get('day');
}
function selectMarketFeedRows(rows,sort,now=Date.now()){
  if(sort==='pending')return rows.filter(m=>m.status==='closed').sort((a,b)=>Date.parse(b.close_time)-Date.parse(a.close_time));
  let result=rows.filter(m=>String(m.status||'open').toLowerCase()==='open'&&Number.isFinite(Date.parse(m.close_time))&&Date.parse(m.close_time)>now);
  if(sort==='today')result=result.filter(m=>ugandaDateKey(m.close_time)===ugandaDateKey(now));
  if(sort==='closing')result=result.filter(m=>Date.parse(m.close_time)-now<=72*3600000);
  if(['live','today','closing'].includes(sort))result.sort((a,b)=>Date.parse(a.close_time)-Date.parse(b.close_time));
  if(sort==='active')result.sort((a,b)=>Number(b.total_pool_ugx||0)-Number(a.total_pool_ugx||0));
  return result;
}

let marketOpenRequestId=0;
async function openMarket(id,{updateUrl=true,preselectLabel=null,openSource='feed'}={}){
  const requestId=++marketOpenRequestId;
  const openingUserId=state.user?.id||null;
  const stillCurrent=()=>requestId===marketOpenRequestId&&(state.user?.id||null)===openingUserId;
  const key='market:'+id;
  let page=null;
  try{
    page=await rpc('market_page',{p_market_id:id});
    if(!stillCurrent())return;
    page.__offline_cache=false;
    if(state.user&&state.online){
      try{
        const {data:user}=await supabase.auth.getUser();
        if(!stillCurrent())return;
        const uid=user.user?.id;
        const {data:ex}=await supabase.from('watchlist').select('id').eq('user_id',uid).eq('market_id',id).maybeSingle();
        if(!stillCurrent())return;
        page.__watched=!!ex;
      }catch{page.__watched=false}
    }else page.__watched=false;
    if(!stillCurrent())return;
    cacheWrite(key,page);
  }catch(e){
    if(!stillCurrent())return;
    const cached=cacheRead(key);
    if(!cached){toast(e.message||'Could not open market',true);return}
    page={...(cached.value||{}),__offline_cache:true,__offline_saved_at:cached.saved_at};
    toast('Offline: showing last synced market ('+cachedAgeLabel(cached)+')');
  }
  if(!stillCurrent())return;
  if(preselectLabel)page.__preselect_label=String(preselectLabel).toUpperCase();
  state.market=page;
  trackBehavior('market_view',{category:page?.market?.category||page?.market?.category_key,marketId:id,metadata:{open_source:openSource,preselected_side:preselectLabel?String(preselectLabel).toUpperCase():null}});
  if(updateUrl&&linkedMarketId()!==id)setMarketUrl(id);
  drawMarket();
  if(state.online&&!isClosed(page.market))startMarketRealtime(id);else stopMarketRealtime();
}
function historySvg(d){
  const yes=(d?.outcomes||[]).find(o=>String(o.label).toUpperCase()==='YES');
  if(!yes)return '<div class="empty">No chart data.</div>';
  const pts=(d.history||[]).filter(x=>x.outcome_id===yes.id).map(x=>validProbability(x.display_probability)).filter(x=>x!=null);
  if(pts.length<2)return '<div class="empty">Probability history will appear after two valid market snapshots.</div>';
  const w=600,h=160,left=38,right=10,top=14,bottom=24;
  const y=v=>h-bottom-(v/100)*(h-top-bottom);
  const xy=pts.map((v,i)=>[left+(i/(pts.length-1))*(w-left-right),y(v)]);
  const path=xy.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  const grid=[0,50,100].map(v=>'<line x1="'+left+'" y1="'+y(v)+'" x2="'+(w-right)+'" y2="'+y(v)+'" stroke="var(--k-line)" stroke-dasharray="5 5"/><text x="0" y="'+(y(v)+4)+'" fill="var(--k-muted)" font-size="12">'+v+'%</text>').join('');
  return '<svg class="spark" role="img" aria-label="YES chance history, latest '+pct(pts[pts.length-1])+'. Snapshots shown in sequence." viewBox="0 0 '+w+' '+h+'">'+grid+'<path d="'+path+'" fill="none" stroke="var(--k-green)" stroke-width="3" vector-effect="non-scaling-stroke"/><text x="'+left+'" y="'+(h-4)+'" fill="var(--k-muted)" font-size="12">Earlier snapshots</text><text x="'+(w-right)+'" y="'+(h-4)+'" text-anchor="end" fill="var(--k-muted)" font-size="12">Latest</text></svg>';
}

async function showAdvancedBuy(m,outcome){
  if(!state.online){toast('Offline: reconnect before placing an order.',true);return}
  if(!state.user){showAuth();return}
  if(!outcome?.id){toast('Outcome unavailable',true);return}
  try{
    const book=await rpc('secondary_orderbook',{p_market_id:m.id,p_outcome_id:outcome.id});
    const bestBid=book?.bids?.[0];
    const bestAsk=book?.asks?.[0];
    const box=$('#advancedBook');
    if(box){
      box.innerHTML=
        '<div class="quote-row"><span>Selected</span><b>'+esc(outcome.label)+'</b></div>'+
        '<div class="quote-row"><span>Best buyer</span><b>'+(bestBid?ugx(bestBid.price_per_1000_ugx)+' / 1,000':'None yet')+'</b></div>'+
        '<div class="quote-row"><span>Best seller</span><b>'+(bestAsk?ugx(bestAsk.price_per_1000_ugx)+' / 1,000':'None yet')+'</b></div>'+
        '<div class="quote-row"><span>Recent trades</span><b>'+Number(book?.recent_fills?.length||0)+'</b></div>';
    }

    if(!confirm('Advanced '+outcome.label+' trading\n\nThe order book is shown below. Place a limit BUY order?'))return;

    const qty=Number(prompt('How much '+outcome.label+' position do you want? Use 1,000 steps.','5000')||0);
    if(qty<1000||qty%1000!==0){
      toast('Use 1,000-unit steps',true);
      return;
    }

    const suggested=bestAsk?.price_per_1000_ugx||bestBid?.price_per_1000_ugx||'';
    const price=Number(prompt(
      'Maximum price for each 1,000 of position.'+
      (bestAsk?' Best seller asks '+ugx(bestAsk.price_per_1000_ugx)+'.':''),
      String(suggested)
    )||0);
    if(price<=0)return;

    const reserve=Math.ceil(qty*price/1000);
    if(!confirm('Reserve up to '+ugx(reserve)+' for this advanced order?'))return;

      try{await rpc('settle_market',{p_market_id:m.id,p_resolved_outcome_id:oid,p_resolution_note:note});toast('Market settled');await reload()}
      catch(e){toast(e.message,true)}
    };
    if($('#adminVoidBtn'))$('#adminVoidBtn').onclick=async()=>{
      const note=(prompt('Explain the specific published-rule void condition and evidence (20+ characters)','')||'').trim();
      if(note.length<20){toast('A documented void reason of at least 20 characters is required.',true);return}
      if(!confirm('Void '+m.title+'? Only proceed when its frozen rules and approval workflow authorize a refund.'))return;
      try{await rpc('void_market',{p_market_id:m.id,p_resolution_note:note});toast('Market voided');await reload()}
      catch(e){toast(e.message,true)}
    };
  }
  $('#shareMarket').onclick=()=>shareMarketLink(m.id,m.title);
  $('#closeMarket').onclick=()=>{marketOpenRequestId++;stopMarketRealtime();$('#overlay').innerHTML='';state.market=null;setMarketUrl(null,true)};
}

function claimAuthorityName(id){
  const key=String(id||'');
  const names={
    'ubos-official':'Uganda Bureau of Statistics (UBOS)',
    'bank-of-uganda':'Bank of Uganda',
    'pau-official':'Petroleum Authority of Uganda',
    'memd-official':'Ministry of Energy and Mineral Development (MEMD)',
    'maaif-official':'Ministry of Agriculture, Animal Industry and Fisheries (MAAIF)',
    'unma-official':'Uganda National Meteorological Authority (UNMA)',
    'parliament-uganda':'Parliament of Uganda',
    'electoral-commission-ug':'Electoral Commission of Uganda',
    'uganda-police-official':'Uganda Police Force',
    'ura-official':'Uganda Revenue Authority',
    'statehouse-uganda':'State House Uganda',
    'ucc-official':'Uganda Communications Commission',
    'uneb-official':'Uganda National Examinations Board',
    'nche-uganda-universities':'National Council for Higher Education'
  };
  return names[key]||key.replaceAll('-',' ');
}
function claimVerificationLabel(x){
  const s=String(x?.verification_status||'unverified');
  const labels={
    verified:'Verified by official source',
    contradicted:'Contradicted by official source',
    official_source_available:'Official source mapped',
    needs_value_verification:'Checking official value',
    needs_authoritative_fuel_source:'Needs fuel type + location',
    unsupported:'No official verifier yet',
    not_verifiable:'Not verifiable as a factual claim',
    opinion_or_causal_claim:'Opinion / causal claim'
  };
  if(labels[s])return labels[s];
  const source=x?.verification_source_id||x?.authoritative_source_id;
  if(source)return 'Check with '+claimAuthorityName(source);
  return s.replaceAll('_',' ');
}
function claimMarketLabel(x){
  const raw=String(x?.marketability_status||x?.market_eligibility||'context_only');
  const labels={
    context_only:'Context only · not a market',
    future_claim_candidate:'Possible future market · needs official rule',
    needs_future_rule:'Needs a future deadline / rule',
    needs_verifier_and_location:'Needs verifier + location',
    needs_location_and_threshold:'Needs location + measurable threshold',
    needs_quantitative_rule:'Needs a measurable rule',
    blocked_unverifiable:'Blocked · no reliable verifier',
    not_market_ready:'Not market-ready',
    eligible:'Potential market · still needs full contract checks'
  };
  return labels[raw]||raw.replaceAll('_',' ');
}

async function loadBetaMission(){
  if(!state.user){state.betaMission=null;return}
  const userId=state.user.id;
  const request=(state.betaMissionRequest||0)+1;state.betaMissionRequest=request;
  const current=()=>state.user?.id===userId&&state.betaMissionRequest===request;
  try{
    const data=await rpc('my_positions');
    if(!current())return;
    const positions=Array.isArray(data?.positions)?data.positions:[];
    const trades=positions.reduce((sum,p)=>sum+Math.max(0,Number(p?.trade_count||0)),0);
    const goal=3;
    state.betaMission={trades,goal,complete:trades>=goal,remaining:Math.max(0,goal-trades)};
  }catch(e){
    if(!current())return;
    state.betaMission=null;
    reportClientError(e.message||'Could not load beta mission',e.stack||'',{kind:'beta_mission_load'});
  }
}

async function cashOutSimple(pos){
  if(!state.online){toast('Offline: reconnect before exiting a position.',true);return}
  try{
    const max=Number(pos.sellable_stake_ugx||0);
    if(max<1000){toast('Nothing is available to exit',true);return}
    const q=await rpc('secondary_cashout_quote',{
      p_source_position_id:pos.position_id,
      p_quantity_stake_ugx:max
    });
    const fill=Number(q.fillable_stake_ugx||0);
    const proceeds=Number(q.estimated_cashout_ugx||0);

    if(fill<1000){
      toast('No buyer is ready right now. Use Advanced offer if you want to set your own price.',true);
      return;
    }

    const action=q.mode==='cash'?'Cash Out':'Exit Prediction';
    const partial=fill<max

function integrityCanonical(value){
  if(value===null||typeof value!=='object')return JSON.stringify(value);
  if(Array.isArray(value))return '['+value.map(integrityCanonical).join(',')+']';
  return '{'+Object.keys(value).sort().map(k=>JSON.stringify(k)+':'+integrityCanonical(value[k])).join(',')+'}';
}
function integrityBase64Url(bytes){
  let binary='';for(const b of bytes)binary+=String.fromCharCode(b);
  return btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/g,'');
}
const __integrityCallbacks=new Map();
let __integrityListenerInstalled=false;

function integrityBridge(){
  const bridge=window.PredictUGIntegrity;
  if(!bridge||typeof bridge.postMessage!=='function')return null;
  if(!__integrityListenerInstalled){
    bridge.onmessage=event=>{
      let data=null;
      try{data=JSON.parse(String(event?.data||'{}'))}catch{return}
      const callbackId=String(data?.callback_id||'');
      const entry=__integrityCallbacks.get(callbackId);
      if(!entry)return;
      __integrityCallbacks.delete(callbackId);
      clearTimeout(entry.timer);
      entry.resolve(data||{});
    };
    __integrityListenerInstalled=true;
  }
  return bridge;
}

function integrityBridgeCall(action,payload={},timeoutMs=3500){
  const bridge=integrityBridge();
  if(!bridge)return Promise.resolve({configured:false,ready:false,error:'bridge_unavailable'});
  const callbackId='pi-'+crypto.randomUUID();
  return new Promise(resolve=>{
    const timer=setTimeout(()=>{
      __integrityCallbacks.delete(callbackId);
      resolve({configured:false,ready:false,error:'timeout'});
    },timeoutMs);
    __integrityCallbacks.set(callbackId,{resolve,timer});
    try{
      bridge.postMessage(JSON.stringify({action,callback_id:callbackId,...payload}));
    }catch(e){
      clearTimeout(timer);
      __integrityCallbacks.delete(callbackId);
      resolve({configured:false,ready:false,error:'bridge_post_failed'});
    }
  });
}

async function paymentIntegrityProof(action,payload){
  const material={action,...payload};
  const digest=new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(integrityCanonical(material))));
  const request_hash=integrityBase64Url(digest);

  try{
    let status=await integrityBridgeCall('status',{},1800);
    if(!status?.configured)return {request_hash};

    if(!status?.ready){
      await integrityBridgeCall('prepare',{},1800);
      for(let i=0;i<8;i++){
        await new Promise(r=>setTimeout(r,350));
        status=await integrityBridgeCall('status',{},1800);
        if(status?.ready)break;
      }
    }
    if(!status?.ready)return {request_hash};

    const result=await integrityBridgeCall('token',{request_hash},10000);
    return result?.token?{request_hash,integrity_token:result.token}:{request_hash};
  }catch(e){
    reportClientError(e.message||'Play Integrity bridge failed',e.stack||'',{kind:'play_integrity'});
    return {request_hash};
  }
}
async function paymentApi(action,payload={}){
  if(!state.online)throw new Error('Offline: reconnect before starting or changing a payment.');
  if(!state.session?.access_token)throw new Error('Sign in first');
  const integrity=await paymentIntegrityProof(action,payload);
  const res=await fetch(SUPABASE_URL+'/functions/v1/predict-ug-payments',{
    method:'POST',
    headers:{'content-type':'application/json','authorization':'Bearer '+state.session.access_token},
    body:JSON.stringify({action,...payload,...integrity}),
    signal:rpcTimeoutSignal(20000)
  });
  const data=await res.json();
  if(!res.ok)throw new Error(data.error||'Payment request failed');
  return data;
}

function paymentCustomerStatusLabel(value){
  const s=String(value||'').toLowerCase();
  const labels={deposit_requested:'Deposit requested',waiting_for_payment:'Waiting for payment',verifying_payment:'Verifying payment',deposited:'Deposited',deposit_failed:'Deposit failed',deposit_reversed:'Deposit reversed',withdrawal_requested:'Withdrawal requested',payout_pending:'Payout pending',payout_verification_pending:'Payout verification pending',paid_out:'Paid out',funds_returned:'Funds returned',withdrawal_failed_review_required:'Withdrawal needs review'};
  return labels[s]||String(value||'Pending').replace(/_/g,' ');
}
function paymentActivityStatus(item){
  const status=String(item?.customer_status||item?.payment_status||'pending').toLowerCase();
  if(String(item?.direction||'').toLowerCase()!=='withdrawal')return status;
  if(status==='paid_out'||status==='completed'){
    return item?.payment_status==='completed'&&item?.withdrawal_payout_confirmed===true?'paid_out':'payout_verification_pending';
  }
  if(status==='funds_returned'&&item?.withdrawal_release_confirmed!==true)return 'withdrawal_failed_review_required';
  return status;
}

async function toggleSavedMarket(marketId){

async function merchantPasskeyRequest(type, payload = {}) {
  if (!state.session?.access_token) throw new Error('Sign in as an administrator first');
  const response = await fetch(SUPABASE_URL + '/functions/v1/merchant-momo-ingest', {
    method: 'POST',
    headers: { 'content-type': 'application/json', apikey: SUPABASE_KEY, authorization: 'Bearer ' + state.session.access_token },
    body: JSON.stringify({ type, ...payload }),
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error || 'Merchant passkey request failed');
  return data;
}
function merchantPasskeyBytes(value) {
  const text = String(value);
  const padded = text.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((text.length + 3) % 4);
  const raw = atob(padded);
  return Uint8Array.from(raw, ch => ch.charCodeAt(0));
}
function merchantPasskeyB64(value) {
  const bytes = new Uint8Array(value); let raw = '';
  for (const byte of bytes) raw += String.fromCharCode(byte);
  return btoa(raw).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
}
async function registerMerchantPasskey() {
  try {
    const options = await merchantPasskeyRequest('passkey_register_options');
    const credential = await navigator.credentials.create({ publicKey: {
      ...options,
      challenge: merchantPasskeyBytes(options.challenge),
      user: { ...options.user, id: merchantPasskeyBytes(options.user.id) },
      excludeCredentials: (options.excludeCredentials || []).map(item => ({ ...item, id: merchantPasskeyBytes(item.id) })),
    }});
    if (!credential) throw new Error('Passkey registration was cancelled');
    const response = credential.response;
    await merchantPasskeyRequest('passkey_register_verify', { challenge_id: options.challenge_id, response: {
      id: credential.id, rawId: merchantPasskeyB64(credential.rawId), type: credential.type,
      authenticatorAttachment: credential.authenticatorAttachment || undefined,
      clientExtensionResults: credential.getClientExtensionResults ? credential.getClientExtensionResults() : {},
      response: { clientDataJSON: merchantPasskeyB64(response.clientDataJSON), attestationObject: merchantPasskeyB64(response.attestationObject), transports: response.getTransports ? response.getTransports() : [] },
    }});
    toast('Merchant admin passkey registered');
  } catch (error) { toast(error.message || 'Could not register the merchant passkey', true); }
}
async function runMerchantPasskeyAdminAction(action,payload) {
  if (!window.PublicKeyCredential || !navigator.credentials) throw new Error('This browser does not support passkeys');
  const options = await merchantPasskeyRequest('passkey_admin_action_options', { action, payload });
  const credential = await navigator.credentials.get({ publicKey: {
    ...options,
    challenge: merchantPasskeyBytes(options.challenge),
    allowCredentials: (options.allowCredentials || []).map(item => ({ ...item, id: merchantPasskeyBytes(item.id) })),
  }});
  if (!credential) throw new Error('Passkey confirmation was cancelled');
  const response = credential.response;
  return merchantPasskeyRequest('passkey_admin_action_execute', {
    action, payload, challenge_id: options.challenge_id, response: {
      id: credential.id, rawId: merchantPasskeyB64(credential.rawId), type: credential.type,
      authenticatorAttachment: credential.authenticatorAttachment || undefined,
      clientExtensionResults: credential.getClientExtensionResults ? credential.getClientExtensionResults() : {},
      response: {
        clientDataJSON: merchantPasskeyB64(response.clientDataJSON),
        authenticatorData: merchantPasskeyB64(response.authenticatorData),
        signature: merchantPasskeyB64(response.signature),
        userHandle: response.userHandle ? merchantPasskeyB64(response.userHandle) : null,
      },
    },
  });
}

/* BEGIN GENERATED MERCHANT REPORTING MODULE */
/** Validate the read-only reporting transport before any UI state is replaced. */
function validateMerchantReporting(events, devices) {
  const object = value => value !== null && typeof value === 'object' && !Array.isArray(value);
  if (!Array.isArray(events) || !Array.isArray(devices) ||
      !events.every(object) || !devices.every(object)) {
    throw new Error('Merchant reporting response was incomplete');
  }
  for (const event of events) {
    if (!['MTN', 'AIRTEL'].includes(event.network) ||
        !['incoming', 'outgoing', 'unknown'].includes(event.direction)) {
      throw new Error('Merchant reporting event contract was invalid');
    }
  }
  for (const device of devices) {
    if (typeof device.enabled !== 'boolean' ||
        !['MTN', 'AIRTEL', 'BOTH'].includes(device.network_scope)) {
      throw new Error('Merchant reporting device contract was invalid');
    }
  }
  return {events, devices};
}


/** Read independently of the full admin dashboard; this adapter has no write RPC. */
async function fetchMerchantReporting(readRpc) {
  const [events, devices] = await Promise.all([
    readRpc('admin_merchant_momo_events', {p_limit: 50}),
    readRpc('admin_list_merchant_ingest_devices'),
  ]);
  return validateMerchantReporting(events, devices);
}

/** Commit a complete snapshot only while its initiating admin/request still owns it. */
function applyMerchantReportingSnapshot(state, snapshot, userId, request, refreshedAt) {
  if (state.user?.id !== userId || !state.isAdmin || state.merchantReportingRequest !== request) {
    return false;
  }
  state.merchantEvents = snapshot.events;
  state.merchantDevices = snapshot.devices;
  state.merchantReportingRefreshedAt = refreshedAt;
  state.merchantReportingError = '';
  return true;
}

/* END GENERATED MERCHANT REPORTING MODULE */
async function refreshMerchantReporting(){
  if(!state.user||!state.isAdmin){toast('Admin access required',true);return}
  if(state.merchantReportingLoading)return;
  const userId=state.user.id;
  const request=(state.merchantReportingRequest||0)+1;
  state.merchantReportingRequest=request;
  state.merchantReportingLoading=true;
  state.merchantReportingError='';
  if(state.tab==='admin')render();
  try{
    // Read-only, small-scope refresh; never wait on 24 unrelated Admin RPCs.
    const snapshot=await fetchMerchantReporting(rpc);
    if(!applyMerchantReportingSnapshot(state,snapshot,userId,request,new Date().toISOString()))return;
    toast('MTN reporting refreshed · no payment status was changed');
  }catch(e){
    if(state.user?.id!==userId||!state.isAdmin||state.merchantReportingRequest!==request)return;
    state.merchantReportingError='Could not refresh merchant reporting. Existing records may be stale; retry when connected.';
    toast(e?.message||'Merchant reporting refresh failed',true);
  }finally{
    if(state.merchantReportingRequest===request){
      state.merchantReportingLoading=false;
      if(state.user?.id===userId&&state.isAdmin&&state.tab==='admin')render();
    }
  }
}

function passwordLooksStrong(password){
  return typeof password==='string'&&password.length>=8&&password.length<=128;
}

function normalizePhone(value){
  let s=String(value||'').trim().replace(/[\s()-]/g,'');
  if(s.startsWith('00'))s='+'+s.slice(2);
  if(/^0\d{9}$/.test(s))s='+256'+s.slice(1);
  else if(/^256\d{9}$/.test(s))s='+'+s;
  return /^\+[1-9]\d{7,14}$/.test(s)?s:'';
}
function authIdentifier(value){
  const phone=normalizePhone(value);
  return phone?{type:'phone',value:phone}:null;
}
function userIdentifier(user){
  const phone=normalizePhone(user?.user_metadata?.phone_login||user?.phone||'');
  return phone?{type:'phone',value:phone}:null;
}
async function phonePasswordRequest(phone,password,action='signin'){
  const res=await fetch(SUPABASE_URL+'/functions/v1/secure-signup',{
    method:'POST',
    headers:{'content-type':'application/json'},
    body:JSON.stringify({phone,password,action})
  });
  const data=await res.json().catch(()=>({}));
  if(!res.ok)throw new Error(data.error||'Authentication failed');
  return data;
}
async function applyReturnedSession(data){
  if(!data?.session?.access_token||!data?.session?.refresh_token)throw new Error('Could not start your session');
  const {error}=await supabase.auth.setSession({
    access_token:data.session.access_token,
    refresh_token:data.session.refresh_token
  });
  if(error)throw error;
}

// Phone-login metadata is an identifier, NOT evidence of phone ownership.
// Only the authenticated provider's phone_confirmed_at can establish SMS proof.
function confirmedPhoneForUser(user,expected){
  return Boolean(
    user?.id&&user?.phone_confirmed_at&&
    normalizePhone(user?.phone||'')===expected&&
    normalizePhone(user?.user_metadata?.phone_login||'')===expected
  );
}
async function showPhoneVerification(){
  if(!state.user){showAuth();return}
  if(!state.online){toast('Connect to the internet to verify your phone.',true);return}
  const accountId=state.user.id;
  const current=()=>state.user?.id===accountId;
  const {data:auth,error:authError}=await supabase.auth.getUser();
  if(authError)throw authError;
  const user=auth?.user;
  if(!current()||user?.id!==accountId)throw new Error('Account changed. Sign in again.');
  const phone=userIdentifier(user)?.value;
  if(!phone)throw new Error('No valid account phone number found. Contact support.');
  // The original phone-alias email is immutable. User metadata alone can be edited,
  // so it cannot authorize linking a different phone to this login identity.
  const encoded=new TextEncoder().encode('predict-ug-phone:'+phone);
  const digest=await crypto.subtle.digest('SHA-256',encoded);
  const hex=Array.from(new Uint8Array(digest),b=>b.toString(16).padStart(2,'0')).join('');
  const alias='phone-'+hex+'@login.predictug.invalid';
  if(!current()||String(user.email||'').toLowerCase()!==alias){

  }

  $('#overlay').innerHTML=
    '<div class="modal"><div class="sheet" style="max-width:480px">'+
      '<button class="close" id="phoneVerifyClose">✕</button>'+
      '<h2>Verify your phone</h2>'+

      '<p class="auth-note">'+(already?'Your phone number is confirmed by the sign-in provider.':'Your number is not yet SMS verified. Receiving a code requires an active SMS provider. Your phone/password login alone is not proof of phone ownership.')+'</p>'+
      (already?'':'<div class="auth-wrap">'+
        '<button class="btn primary" id="sendPhoneOtp">Send SMS verification code</button>'+
        '<div id="phoneOtpEntry" style="display:none">'+
          '<input class="input" id="phoneOtpToken" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit SMS code">'+
          '<button class="btn primary" id="confirmPhoneOtp">Confirm SMS code</button>'+
        '</div>'+
        '<p class="auth-note" id="phoneOtpStatus" role="status"></p>'+
      '</div>')+
    '</div></div>';

  const status=$('#phoneOtpStatus');
  const sendBtn=$('#sendPhoneOtp'),confirmBtn=$('#confirmPhoneOtp');
  sendBtn.onclick=async()=>{
    if(!current()||!state.online){status.textContent='Reconnect or sign in again.';return}
    sendBtn.disabled=true;
    try{
      // Supabase sends a provider OTP. We never create or accept local fake codes.
      const {data,error}=await supabase.auth.updateUser({phone});
      if(error)throw error;
      if(!current()||data?.user?.id!==accountId)throw new Error('Account changed during phone verification.');
      sent=true;$('#phoneOtpEntry').style.display='block';
      status.textContent='Request accepted. Enter the SMS code if it arrives. Do not share it.';
    }catch(e){
      sent=false;
      status.textContent='SMS verification unavailable: '+String(e?.message||'please retry later')+'. No number was marked verified.';
    }finally{sendBtn.disabled=false}
  };
  confirmBtn.onclick=async()=>{
    if(!sent||!current()||!state.online){status.textContent='Request a code while signed in and online.';return}
    const token=String($('#phoneOtpToken')?.value||'').trim();
    if(!/^[0-9]{6}$/.test(token)){status.textContent='Enter the six digits from your SMS.';return}
    confirmBtn.disabled=true;
    try{
      const {error}=await supabase.auth.verifyOtp({phone,token,type:'phone_change'});
      if(error)throw error;
      const check=await supabase.auth.getUser();
      if(check.error)throw check.error;
      if(!current()||check.data?.user?.id!==accountId||!confirmedPhoneForUser(check.data?.user,phone)){
        throw new Error('The sign-in provider has not yet confirmed this number. Please try again.');
      }
      status.textContent='Phone ownership verified by SMS.';
      await loadSession();
      if(current()){toast('Phone verified');profileMenu()}
    }catch(e){status.textContent=String(e?.message||'Could not verify this code')}
    finally{confirmBtn.disabled=false}
  };
}

/* Shared updater for the live web shell and bundled Android fallback. */
function installedAndroidBuild(){
  const match=String(navigator.userAgent||'').match(/\bPredictUG\/(\d+\.\d+\.\d+(?:-[a-z0-9.]+)?)/i);
  if(!match)return null;
  const version=match[1],channel=version.includes('-merchant')?'merchant':'customer';
  const versionCode=typeof APP_VERSION_CODE!=='undefined'&&version===APP_BUILD?APP_VERSION_CODE:null;
  return {version,versionCode,channel};
}
function trustedApkDownload(value){
  const u=new URL(String(value||''),PUBLIC_ORIGIN);
  if(u.protocol!=='https:'||u.origin!==PUBLIC_ORIGIN||u.username||u.password
    ||!/^\/downloads\/predict-ug(?:-customer-\d+\.\d+\.\d+)?\.apk$/.test(u.pathname)
    ||u.search||u.hash)throw new Error('Untrusted APK download');
  return u.toString();
}
function androidApkDownload(meta){
  // External to the WebView origin, so already-installed versions hand this to
  // Android's browser. Pin repository and immutable artifact commit.
  return 'https://raw.githubusercontent.com/festusakona40-code/Predict-UG-Core/'
    +meta.sourceArtifactCommit+'/predict-ug.apk';
}
async function fetchReleaseMetadata(){
  // One authoritative CORS-enabled release service, independent of Render.
  // Even a stale live-web shell must not offer obsolete APK metadata.
  const endpoint=INSTALL_ORIGIN+'?release=1&t='+Date.now();
  const r=await fetch(endpoint,{
    cache:'no-store',signal:AbortSignal.timeout(8000)
  });
  if(!r.ok)throw new Error('Could not check for app updates');
  const meta=await r.json();
  if(!/^\d+\.\d+\.\d+$/.test(String(meta?.version||''))
    ||!Number.isSafeInteger(meta?.versionCode)||meta.versionCode<1
    ||!/^[a-f0-9]{64}$/i.test(String(meta?.sha256||''))
    ||!Number.isSafeInteger(meta?.sizeBytes)||meta.sizeBytes<1
    ||!/^[a-f0-9]{64}$/i.test(String(meta?.signingCertificateSha256||''))
    ||!/^[a-f0-9]{40}$/i.test(String(meta?.sourceArtifactCommit||'')))
    throw new Error('Update information is invalid');
  // A public update may only point to a verified practice consumer APK.
  // This pin intentionally requires a new reviewed release for any signing-key
  // transition; Android itself must confirm upgrades of an installed package.
  if(meta.channel!=='customer'||meta.productionMoneyEnabled!==false
    ||meta.betaSigning!==true||meta.signingIdentity!=='Android Debug'
    ||String(meta.signingCertificateSha256).toLowerCase()!=='66a1431469d7a67450a3d28ce7adfcf11295eb274be305add681613bc1ad4d55')
    throw new Error('Untrusted Android release identity');
  const download=trustedApkDownload(meta.immutableDownload);
  if(new URL(download).pathname!=='/downloads/predict-ug-customer-'+meta.version+'.apk')
    throw new Error('APK version does not match update information');
  return meta;
}
function newerAndroidRelease(meta,installed){
  if(Number.isSafeInteger(installed.versionCode))return meta.versionCode>installed.versionCode;
  const next=meta.version.split('.').map(Number),current=installed.version.split('.').map(Number);
  for(let i=0;i<3;i++){
    if(next[i]!==current[i])return next[i]>current[i];
  }
  return false;
}
async function checkForAppUpdate(interactive=false){
  const installed=installedAndroidBuild();
  if(!installed||installed.channel!=='customer')return null;
  if(!state.online){if(interactive)toast('Offline: reconnect to check for updates.',true);return null}
  try{
    const meta=await fetchReleaseMetadata(),newer=newerAndroidRelease(meta,installed);
    state.releaseUpdate=newer?meta:null;
    if(newer&&!interactive){
      const key='predict_ug_update_notice_'+meta.versionCode;
      try{
        if(localStorage.getItem(key)!=='1'){
          localStorage.setItem(key,'1');
          toast('Predict UG '+meta.version+' is available · Profile → Update app');
        }
      }catch{}
    }
    return meta;
  }catch(error){
    state.releaseUpdate=null;
    if(interactive)toast('Could not check for app updates. Try again.',true);
    return null;
  }
}
function usesBundledAndroidInterface(){
  const installed=installedAndroidBuild();
  if(installed?.channel!=='customer')return false;
  // Preserve the audited bundle for every future consumer build until
  // a separately reviewed live-web delivery policy is approved.
  if(Number.isSafeInteger(installed.versionCode))return installed.versionCode>=86;
  // Compatibility for historic beta shells without an embedded versionCode.
  return /^0[.]7[.][0-9]+$/.test(installed.version)
    &&Number(installed.version.split('.')[2])>=86;
}
async function refreshAppInterface(){
  if('serviceWorker' in navigator){
    const regs=await navigator.serviceWorker.getRegistrations();
    await Promise.all(regs.filter(reg=>{
      const scope=new URL(reg.scope);
      return scope.origin===location.origin&&(scope.pathname==='/'||scope.pathname.startsWith('/functions/v1/predict-ug'));
    }).map(reg=>reg.unregister()));
  }
  if('caches' in window){
    const keys=await caches.keys();
    await Promise.all(keys.filter(key=>key.startsWith('predict-ug')).map(key=>caches.delete(key)));
  }
  const current=new URL(location.href);
  const target=location.origin==='https://appassets.androidplatform.net'&&!usesBundledAndroidInterface()?new URL(PUBLIC_ORIGIN+'/'):current;
  if(target!==current){target.search=current.search;target.hash=current.hash}
  target.searchParams.set('app_update',String(Date.now()));
  location.replace(target.toString());
}
async function forceAppUpdate(){
  if(!state.online){toast('Offline: reconnect before updating Predict UG.',true);return}
  if(state.appUpdateBusy)return;
  state.appUpdateBusy=true;
  try{
    const installed=installedAndroidBuild();
    if(installed?.channel==='customer'){
      toast('Checking your installed app for updates…');
      const meta=await fetchReleaseMetadata();
      if(newerAndroidRelease(meta,installed)){
        toast('Downloading Predict UG '+meta.version+'. Confirm Install in Android, then reopen Predict UG.');
        location.href=androidApkDownload(meta);
        return;
      }
    }
    if(installed?.channel==='customer'){
      // Refresh can fetch current markets, but cannot replace APK-bundled code.
      // Never imply that an old installed binary now contains new features.
      toast('Predict UG '+installed.version+' is installed. Refreshing live data; new app features need a newer APK.');
    }else{
      toast('Refreshing Predict UG live data and interface…');
    }
    await refreshAppInterface();
  }catch(error){toast('Could not update Predict UG. Check your connection and try again.',true)}
  finally{state.appUpdateBusy=false}
}

async function runAppCheck(){
  const out=[];
  try{
    const r=await fetch(INSTALL_ORIGIN+'?health=1&t='+Date.now(),{cache:'no-store'});
    const h=await r.json();
    out.push(h?.ok?'Backend: online':'Backend: problem');
  }catch{out.push('Backend: offline')}
  try{
    const s=await supabase.auth.getSession();
    out.push(s.data?.session?'Session: signed in':'Session: signed out');
  }catch{out.push('Session: check failed')}
  const installed=installedAndroidBuild();
  out.push('App: '+(installed?'Android '+installed.version:'web '+APP_BUILD));
  return out.join(' · ');
}

      try{await supabase.auth.signOut({scope:'local'})}catch{}state.session=null;state.user=null;state.isAdmin=false;state.balance=null;state.portfolio=null;try{localStorage.clear()}catch{}
      $('#overlay').innerHTML='<div class="modal"><div class="sheet" style="max-width:500px"><h2>Account deleted</h2><p>Your Predict UG account access has been removed. Personal data was deleted or anonymized according to the privacy policy.</p><button class="btn primary" id="deleteDone">Done</button></div></div>';$('#deleteDone').onclick=()=>location.reload();
    }catch(e){status.textContent=e.message||'Could not delete account';toast(e.message||'Could not delete account',true);btn.disabled=false}
  };
}

document.addEventListener('click',async e=>{

      if(tab==='media'||tab==='discover')await loadDiscover();

      if(tab==='watchlist'&&state.user)await loadWatchlist();

});

<script>
/* Measure the actual phone header and visual viewport, including keyboard resize. */
(function(){
  const root=document.documentElement,bar=document.querySelector('.topbar'),overlay=document.getElementById('overlay');
  const measure=()=>{
    if(bar)root.style.setProperty('--topbar-height',Math.ceil(bar.getBoundingClientRect().height)+'px');
    const height=window.visualViewport?.height||window.innerHeight;
    root.style.setProperty('--visible-height',Math.round(height)+'px');
  };
  if(window.ResizeObserver&&bar)new ResizeObserver(measure).observe(bar);
  window.addEventListener('resize',measure);
  window.visualViewport?.addEventListener('resize',measure);
  new MutationObserver(()=>{
    const open=!!overlay.querySelector('.modal');
    root.classList.toggle('sheet-open',open);
    overlay.querySelectorAll('.sheet').forEach(sheet=>{
      sheet.setAttribute('role','dialog');sheet.setAttribute('aria-modal','true');
      sheet.querySelectorAll('button.close').forEach(button=>button.setAttribute('aria-label','Close dialog'));
    });
    measure();
  }).observe(overlay,{childList:true,subtree:true});
  if(bar)bar.querySelector('#refreshBtn')?.setAttribute('aria-label','Refresh markets');
  measure();
})();
</script>
